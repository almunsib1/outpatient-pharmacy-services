<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#168fb3}
.container{max-width:980px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1);min-height:calc(100vh - 32px)}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;direction:ltr}
.logo{width:120px;height:120px;object-fit:contain}
.official-header{width:fit-content;max-width:100%;text-align:right;transform:translateY(14px);padding-left:8px;border-left:4px solid #168fb3;direction:rtl}
.official-header h2,.official-header h3{margin:2px 0;font-size:13px;line-height:1.4;color:#168fb3}
hr{border:none;border-top:1px solid #e5e7eb;margin:14px 0}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;direction:ltr}
.date-box,.language-chip{color:#168fb3;padding:4px 0;font-size:13px;font-weight:bold;background:transparent;border:0;font-family:inherit}
.language-chip{cursor:pointer;white-space:nowrap}
.page-title{text-align:center;font-size:24px;font-weight:bold;margin:18px 0 8px;color:#168fb3}
.subtitle{text-align:center;color:#334155;font-size:15px;line-height:1.7;margin:0 auto 22px;max-width:620px}
.portal-grid{display:grid;grid-template-columns:repeat(2,minmax(190px,1fr));gap:14px;max-width:620px;margin:0 auto}
.portal-card{background:#168fb3;border:1px solid #168fb3;border-radius:8px;padding:16px;text-decoration:none;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:108px;transition:.15s ease}
.portal-card:hover{border-color:#0f7592;transform:translateY(-1px);box-shadow:0 8px 18px rgba(22,143,179,.28);filter:brightness(1.05)}
.card-title{font-size:16px;font-weight:bold;color:#fff;margin:0 0 5px}
.card-desc{font-size:12px;color:rgba(255,255,255,.88);line-height:1.55;margin:0}
.card-icon{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}
@media (max-width:700px){
body{padding:10px;background:#fff}
.container{padding:14px;border-radius:0;box-shadow:none;min-height:100vh}
.logo{width:84px;height:84px}
.official-header{transform:translateY(10px)}
.official-header h2,.official-header h3{font-size:12px}
.page-title{font-size:20px}
.subtitle{font-size:13px}
.portal-grid{grid-template-columns:1fr;max-width:310px}
.portal-card{min-height:92px;padding:12px}
.card-title{font-size:15px}
.card-icon{width:34px;height:34px;font-size:19px}
}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <img class="logo" src="logo.png" alt="Logo">
    <div class="official-header">
      <h2 id="officialLine1">تجمع المدينة المنورة الصحي</h2>
      <h3 id="officialLine2">مستشفى الملك فهد بالمدينة المنورة</h3>
      <h3 id="officialLine3">إدارة الرعاية الصيدلانية</h3>
    </div>
  </div>
  <hr>
  <div class="meta-row">
    <div class="date-box" id="dateBox"></div>
    <button type="button" class="language-chip" id="languageToggle" onclick="toggleLanguage()">🌐 ع | E</button>
  </div>
  <h1 class="page-title" id="pageTitle">لوحة التحكم</h1>
  <p class="subtitle" id="subtitle">اختيار صفحة الإدارة المطلوبة.</p>

  <div class="portal-grid" id="portalGrid">
    <a class="portal-card" href="admin.html">
      <div>
        <p class="card-title" id="usersTitle">إدارة المستخدمين الموحدة</p>
        <p class="card-desc" id="usersDesc">إضافة المستخدمين وتحديد صلاحيات الخدمات.</p>
      </div>
      <div class="card-icon">👤</div>
    </a>
    <a class="portal-card" href="medications-admin.html">
      <div>
        <p class="card-title" id="medsTitle">إدارة الأدوية الموحدة</p>
        <p class="card-desc" id="medsDesc">إضافة وتعديل أسماء الأدوية للقوائم المنسدلة.</p>
      </div>
      <div class="card-icon">💊</div>
    </a>
  </div>
</div>

<script>
let currentLang = "ar";
const text = {
  ar:{
    title:"لوحة التحكم",
    subtitle:"اختيار صفحة الإدارة المطلوبة.",
    officialLine1:"تجمع المدينة المنورة الصحي",
    officialLine2:"مستشفى الملك فهد بالمدينة المنورة",
    officialLine3:"إدارة الرعاية الصيدلانية",
    usersTitle:"إدارة المستخدمين الموحدة",
    usersDesc:"إضافة المستخدمين وتحديد صلاحيات الخدمات.",
    medsTitle:"إدارة الأدوية الموحدة",
    medsDesc:"إضافة وتعديل أسماء الأدوية للقوائم المنسدلة."
  },
  en:{
    title:"Control Panel",
    subtitle:"Choose the required administration page.",
    officialLine1:"Madinah Health Cluster",
    officialLine2:"King Fahad Hospital - Madinah",
    officialLine3:"Pharmaceutical Care Administration",
    usersTitle:"Unified User Management",
    usersDesc:"Add users and manage service permissions.",
    medsTitle:"Unified Medication Management",
    medsDesc:"Add and edit medication names for dropdown lists."
  }
};
function setLanguage(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = text[lang].title;
  ["officialLine1","officialLine2","officialLine3"].forEach(id => document.getElementById(id).innerText = text[lang][id]);
  document.getElementById("pageTitle").innerText = text[lang].title;
  document.getElementById("subtitle").innerText = text[lang].subtitle;
  ["usersTitle","usersDesc","medsTitle","medsDesc"].forEach(id => document.getElementById(id).innerText = text[lang][id]);
  renderDate();
}
function toggleLanguage(){setLanguage(currentLang === "ar" ? "en" : "ar")}
function renderDate(){
  const now = new Date();
  const date = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh"}).format(now);
  const day = new Intl.DateTimeFormat(currentLang === "ar" ? "ar-SA" : "en-US",{timeZone:"Asia/Riyadh",weekday:"long"}).format(now);
  document.getElementById("dateBox").innerText = `${day} - ${date}`;
}
setLanguage("ar");
</script>
</body>
</html>
