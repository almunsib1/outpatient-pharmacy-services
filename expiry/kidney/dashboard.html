<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspection Indicator</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:16px;
  color:#168fb3
}

.container{
  max-width:980px;
  margin:auto;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  min-height:calc(100vh - 32px)
}

.top-bar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
  direction:ltr
}

.logo{
  width:120px;
  height:120px;
  object-fit:contain
}

.official-header{
  width:fit-content;
  max-width:100%;
  text-align:right;
  transform:translateY(14px);
  padding-left:8px;
  border-left:4px solid #168fb3;
  direction:rtl
}

.official-header h2,
.official-header h3{
  margin:2px 0;
  font-size:13px;
  line-height:1.4;
  color:#168fb3
}

hr{
  border:none;
  border-top:1px solid #e5e7eb;
  margin:14px 0
}

.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  direction:ltr
}

.date-box{
  color:#168fb3;
  padding:4px 0;
  font-size:13px;
  font-weight:bold;
  text-align:center
}

.language-chip{
  color:#168fb3;
  font-size:13px;
  font-weight:bold;
  padding:4px 0;
  white-space:nowrap;
  background:transparent;
  border:0;
  cursor:pointer;
  font-family:inherit
}

.page-title{
  text-align:center;
  font-size:23px;
  font-weight:bold;
  margin:18px 0 10px;
  color:#168fb3
}

.report-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:0 auto 16px;
  flex-wrap:wrap;
  direction:ltr
}

.report-controls select{
  width:auto;
  min-width:178px;
  height:34px;
  padding:5px 10px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  color:#168fb3;
  font-size:13px;
  font-weight:bold;
  font-family:inherit;
  text-align:center;
  direction:ltr
}

.stats{
  display:flex;
  gap:10px;
  margin-bottom:14px;
  flex-wrap:wrap;
  justify-content:center
}

.stat-card{
  display:grid;
  justify-items:center;
  gap:4px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:8px;
  box-shadow:0 4px 10px rgba(0,0,0,.04);
  padding:10px 18px;
  min-width:118px;
  min-height:52px;
  text-align:center;
  cursor:pointer;
  transition:.15s ease;
  user-select:none
}

.stat-card .num{
  font-size:20px;
  font-weight:bold;
  line-height:1
}

.stat-card .label{
  font-size:13px;
  color:#168fb3;
  font-weight:bold
}

.stat-card.red .num{color:#a12727}
.stat-card.orange .num{color:#eab308}
.stat-card.green .num{color:#0f7592}

.stat-card:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 14px rgba(0,0,0,.08)
}

.stat-card.active-filter{
  transform:translateY(-1px);
  box-shadow:0 6px 14px rgba(0,0,0,.08)
}

.stat-card.red.active-filter{
  background:#fdeaea;
  border-color:#a12727
}

.stat-card.orange.active-filter{
  background:#fff6e0;
  border-color:#eab308
}

.stat-card.green.active-filter{
  background:#e6f2f5;
  border-color:#0f7592
}

/* =========================================================
   MEDICATION SEARCH
========================================================= */

.search-row{
  display:flex;
  justify-content:center;
  margin:0 auto 14px
}

.combo-wrap{
  position:relative;
  width:100%;
  max-width:360px
}

.medicine-search{
  width:100%;
  height:38px;
  padding:7px 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  color:#111827;
  font-size:14px;
  font-family:inherit;
  text-align:left;
  direction:ltr;
  outline:none
}

.medicine-search:focus{
  border-color:#168fb3;
  box-shadow:0 0 0 2px rgba(22,143,179,.12)
}

.combo-options{
  position:absolute;
  top:100%;
  right:0;
  left:0;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:8px;
  margin-top:3px;
  max-height:190px;
  overflow-y:auto;
  box-shadow:0 10px 20px rgba(0,0,0,.1);
  z-index:30;
  display:none
}

.combo-option{
  padding:8px 10px;
  font-size:13px;
  cursor:pointer;
  text-align:left;
  direction:ltr;
  color:#111827
}

.combo-option:hover{
  background:#e0f2fe
}

.combo-empty{
  padding:9px 12px;
  font-size:12px;
  color:#94a3b8;
  text-align:left;
  direction:ltr
}

/* =========================================================
   ACTIONS
========================================================= */

.action-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  direction:ltr
}

.action-btn{
  width:44px;
  min-width:44px;
  min-height:44px;
  padding:0;
  border:0;
  background:transparent;
  color:#168fb3;
  font-size:26px;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-family:inherit
}

.action-btn:hover{
  transform:scale(1.08)
}

/* =========================================================
   SCREEN TABLE
========================================================= */

.table-wrap{
  overflow-x:auto;
  border-radius:10px;
  border:1px solid #e5e7eb;
  box-shadow:0 4px 10px rgba(0,0,0,.04)
}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff
}

th,
td{
  padding:9px 10px;
  text-align:center;
  font-size:13px;
  white-space:nowrap;
  border-bottom:1px solid #e5e7eb
}

th{
  background:#168fb3;
  color:#fff;
  font-weight:bold;
  font-size:14px
}

tr:last-child td{
  border-bottom:0
}

.row-expired{
  background:#fdeaea !important
}

.row-soon{
  background:#fff6e0 !important
}

.date-expired{
  color:#a12727;
  font-weight:bold
}

.date-soon{
  color:#eab308;
  font-weight:bold
}

.date-ok{
  color:#0f7592;
  font-weight:bold
}

.status-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:24px;
  border-radius:999px;
  padding:3px 11px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap
}

.status-pill.expired{
  background:rgba(161,39,39,.12);
  color:#a12727
}

.status-pill.soon{
  background:rgba(234,179,8,.2);
  color:#a16207
}

.status-pill.ok{
  background:rgba(15,117,146,.12);
  color:#0f7592
}

.empty-note,
.refresh-note{
  text-align:center;
  font-size:12px;
  color:#888;
  margin-top:10px
}

/* =========================================================
   PRINT LAYOUT
========================================================= */

#printPages{
  display:none
}

.print-page{
  width:100%;
  height:279mm;
  margin:0;
  padding:7mm 8mm 4mm;
  background:#fff;
  color:#111827;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  page-break-after:always;
  break-after:page
}

.print-page:last-child{
  page-break-after:auto;
  break-after:auto
}

/* =========================================================
   PRINT HEADER
========================================================= */

.print-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  direction:ltr;
  gap:18px;
  min-height:25mm;
  margin:0 0 4mm
}

.print-logo{
  width:78px;
  height:78px;
  object-fit:contain;
  flex:0 0 auto
}

.print-official{
  border-left:3px solid #168fb3
}

html[dir="rtl"] .print-official{
  text-align:right;
  direction:rtl;
  padding:2mm 0 2mm 10px
}

html[dir="ltr"] .print-official{
  text-align:left;
  direction:ltr;
  padding:2mm 0 2mm 6px
}

.print-official h2{
  margin:0 0 3px;
  color:#168fb3;
  font-size:11px;
  line-height:1.4;
  font-weight:700
}

.print-official h3{
  margin:2px 0;
  color:#168fb3;
  font-size:10px;
  line-height:1.35;
  font-weight:600
}

.print-divider{
  border:0;
  border-top:1px solid #cbdfe6;
  margin:0 0 3mm
}

/* =========================================================
   PRINT REPORT INFO
========================================================= */

.print-date{
  text-align:center;
  color:#64748b;
  font-size:9.5px;
  font-weight:600;
  margin:0 0 2mm
}

.print-title{
  text-align:center;
  color:#168fb3;
  font-size:17px;
  line-height:1.25;
  font-weight:700;
  margin:0 0 4mm
}

/* =========================================================
   PRINT TABLE
========================================================= */

.print-table-wrap{
  width:100%;
  border:1.3px solid #168fb3;
  border-radius:2px;
  overflow:hidden;
  margin:0
}

.print-table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed
}

.print-table thead{
  display:table-header-group
}

.print-table tr{
  break-inside:avoid;
  page-break-inside:avoid
}

.print-table th{
  height:8mm;
  background:#168fb3 !important;
  color:#fff !important;
  font-size:9.5px;
  font-weight:700;
  padding:3px 5px;
  border-right:1px solid rgba(255,255,255,.45);
  vertical-align:middle;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
}

.print-table th:last-child{
  border-right:0
}

.print-table tbody tr{
  height:7.45mm
}

.print-table td{
  color:#111827;
  font-size:9px;
  line-height:1.2;
  padding:3px 5px;
  border-top:1px solid #d8e0e5;
  border-right:1px solid #d8e0e5;
  white-space:normal;
  overflow-wrap:anywhere;
  vertical-align:middle
}

.print-table td:last-child{
  border-right:0
}

.print-table th:nth-child(1),
.print-table td:nth-child(1){
  width:32%
}

.print-table th:nth-child(2),
.print-table td:nth-child(2){
  width:18%
}

.print-table th:nth-child(3),
.print-table td:nth-child(3){
  width:26%
}

.print-table th:nth-child(4),
.print-table td:nth-child(4){
  width:24%
}

.print-table .row-expired{
  background:#fdeaea !important;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
}

.print-table .row-soon{
  background:#fff6e0 !important;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
}

/* =========================================================
   PRINT FOOTER
========================================================= */

.print-footer{
  margin-top:auto;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  border-top:1px solid #e2e8f0;
  padding-top:1.5mm;
  min-height:6mm
}

.print-page-number{
  color:#64748b;
  font-size:8.5px;
  line-height:1;
  font-weight:600;
  text-align:center
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px){

  body{
    padding:10px;
    background:#fff
  }

  .container{
    padding:14px;
    border-radius:0;
    box-shadow:none;
    min-height:100vh
  }

  .logo{
    width:84px;
    height:84px
  }

  .official-header{
    transform:translateY(10px)
  }

  .official-header h2,
  .official-header h3{
    font-size:12px
  }

  .page-title{
    font-size:20px;
    margin-bottom:10px
  }

  .report-controls{
    gap:8px;
    margin-bottom:14px
  }

  .report-controls select{
    min-width:150px;
    font-size:12px
  }

  .stat-card{
    min-width:96px;
    padding:8px 12px
  }

  .stat-card .num{
    font-size:18px
  }

  .combo-wrap{
    max-width:300px
  }

  .medicine-search{
    height:40px
  }

  th,
  td{
    padding:8px;
    font-size:12px
  }

  .action-btn{
    width:40px;
    min-width:40px;
    min-height:40px;
    font-size:22px
  }
}

/* =========================================================
   A4
========================================================= */

@page{
  size:A4 portrait;
  margin:8mm
}

@media print{

  html,
  body{
    width:100% !important;
    margin:0 !important;
    padding:0 !important;
    background:#fff !important
  }

  .container{
    display:none !important
  }

  #printPages{
    display:block !important
  }

  .print-page{
    box-shadow:none !important
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="top-bar">

    <img
      class="logo"
      src="../../logo.png"
      alt="Logo">

    <div class="official-header">
      <h2 id="officialLine1">تجمع المدينة المنورة الصحي</h2>
      <h3 id="officialLine2">مستشفى الملك فهد بالمدينة المنورة</h3>
      <h3 id="officialLine3">إدارة الرعاية الصيدلانية</h3>
    </div>

  </div>

  <hr>

  <div class="meta-row">

    <div
      class="date-box"
      id="dateBox">
    </div>

    <button
      type="button"
      class="language-chip"
      id="languageToggle"
      onclick="toggleLanguage()">
      🌐 ع | E
    </button>

  </div>

  <h1
    class="page-title"
    id="pageTitle">
    Inspection Indicator
  </h1>

  <div class="report-controls">

    <select
      id="reportType"
      onchange="refreshReportView()">

      <option value="inspection">
        Inspection Report
      </option>

      <option value="removal">
        Expiry Removal Report
      </option>

    </select>

    <select
      id="reportMonth"
      onchange="refreshReportView()">
    </select>

  </div>

  <div class="stats">

    <div
      class="stat-card red"
      id="cardExpired"
      data-filter="expired"
      role="button"
      tabindex="0"
      aria-pressed="false"
      onclick="setFilter('expired')">

      <div
        class="label"
        id="labelExpired">
        This Month
      </div>

      <div
        class="num"
        id="countExpired">
        -
      </div>

    </div>

    <div
      class="stat-card orange"
      id="cardSoon"
      data-filter="soon"
      role="button"
      tabindex="0"
      aria-pressed="false"
      onclick="setFilter('soon')">

      <div
        class="label"
        id="labelSoon">
        Within 3 Months
      </div>

      <div
        class="num"
        id="countSoon">
        -
      </div>

    </div>

    <div
      class="stat-card green"
      id="cardOk"
      data-filter="ok"
      role="button"
      tabindex="0"
      aria-pressed="false"
      onclick="setFilter('ok')">

      <div
        class="label"
        id="labelOk">
        Within Safe Range
      </div>

      <div
        class="num"
        id="countOk">
        -
      </div>

    </div>

  </div>

  <div class="action-row">

    <button
      type="button"
      class="action-btn"
      id="printBtn"
      onclick="printReport()"
      title="Print"
      aria-label="Print">
      🖨️
    </button>

    <div class="combo-wrap">

      <input
        type="text"
        class="medicine-search"
        id="medicineSearch"
        autocomplete="off"
        dir="ltr"
        placeholder="Search by medication name">

      <div
        class="combo-options"
        id="medicineSearchOptions">
      </div>

    </div>

    <button
      type="button"
      class="action-btn"
      id="refreshBtn"
      onclick="window.location.reload()"
      title="Refresh"
      aria-label="Refresh">
      🔄
    </button>

  </div>

  <div class="table-wrap">

    <table>

      <thead>
        <tr>
          <th id="colName">Medication Name</th>
          <th id="colExpiry">Expiry Date</th>
          <th id="colStatus">Status</th>
          <th id="colEmployee">Employee Name</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>

    </table>

  </div>

  <div
    class="empty-note"
    id="emptyNote"
    style="display:none">
  </div>

  <div
    class="refresh-note"
    id="refreshNote">
    Auto-refreshes every 10 seconds
  </div>

</div>

<div id="printPages"></div>

/* =========================================================

function renderDate(){

  const date =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Riyadh"
      }
    ).format(
      now
    );

      currentLang === "ar"

    );

    "dateBox"
  ).innerText =

}


/* =========================================================
   REPORT MONTH
========================================================= */

function buildReportMonthOptions(){

  const select =
    document.getElementById(
      "reportMonth"
    );

  if (
    !select ||
    select.options.length
  ){
    return;
  }

  const monthNames = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
  ];

  const today =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Riyadh"
      }
    ).format(
      new Date()
    );

  const currentYear =
    Number(
      today.substring(
        0,
        4
      )
    );

  for (
    let year = currentYear - 1;
    year <= currentYear + 1;
    year++
  ){

    monthNames.forEach(
      function(
        monthName,
        index
      ){

        const monthNumber =
          String(
            index + 1
          ).padStart(
            2,
            "0"
          );

        const option =
          document.createElement(
            "option"
          );

        option.value =
          year +
          "-" +
          monthNumber;

        option.textContent =
          monthName +
          " " +
          year;

        select.appendChild(
          option
        );

      }
    );

  }

  select.value =
    getCurrentMonthValue();

}


function getCurrentMonthValue(){

  const today =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Riyadh"
      }
    ).format(
      new Date()
    );

  return today.substring(
    0,
    7
  );

}


function getReportMonth(){

  const select =
    document.getElementById(
      "reportMonth"
    );

  return (
    select &&
    select.value
  )
    ? select.value
    : getCurrentMonthValue();

}


function getReportType(){

  const select =
    document.getElementById(
      "reportType"
    );

  return (
    select &&
    select.value
  )
    ? select.value
    : "inspection";

}


function getReportMonthLabel(){

  const select =
    document.getElementById(
      "reportMonth"
    );

  return (
    select &&
    select.selectedOptions.length
  )
    ? select.selectedOptions[0].textContent
    : getReportMonth();

}


function updateReportTitle(){

  const title =
    getReportType() === "removal"
      ? text[currentLang].removalReport
      : text[currentLang].inspectionReport;

  document.getElementById(
    "pageTitle"
  ).innerText =
    title +
    " - " +
    getReportMonthLabel();

}


function refreshReportView(){

  activeFilter =
    null;

  updateFilterCardsUI();

  updateReportTitle();

  renderRows(
    lastItems
  );

}


/* =========================================================
   REPORT FILTER
========================================================= */

function reportBaseItems(){

  const month =
    getReportMonth();

  const reportType =
    getReportType();

  return lastItems.filter(
    function(item){

      const itemMonth =
        String(
          item.expiry ||
          ""
        ).substring(
          0,
          7
        );

      if (
        reportType === "removal"
      ){

        return (
          itemMonth ===
          month
        );

      }

      return (
        itemMonth >=
        month
      );

    }
  );

}


function itemBucket(item){

  const itemMonth =
    String(
      item.expiry ||
      ""
    ).substring(
      0,
      7
    );

  const reportMonth =
    getReportMonth();

  if (
    getReportType() === "removal"
  ){

    return "expired";

  }

  if (
    itemMonth === reportMonth
  ){

    return "expired";

  }

  const distance =
    monthDistance(
      reportMonth,
      itemMonth
    );

  if (
    distance > 0 &&
    distance <= 3
  ){

    return "soon";

  }

  return "ok";

}


function monthDistance(
  fromMonth,
  toMonth
){

  const from =
    String(
      fromMonth ||
      ""
    ).split(
      "-"
    );

  const to =
    String(
      toMonth ||
      ""
    ).split(
      "-"
    );

  if (
    from.length < 2 ||
    to.length < 2
  ){

    return 999;

  }

  return (
    (
      Number(
        to[0]
      ) -
      Number(
        from[0]
      )
    ) * 12
  ) +
  (
    Number(
      to[1]
    ) -
    Number(
      from[1]
    )
  );

}


function setFilter(status){

  activeFilter =
    activeFilter === status
      ? null
      : status;

  updateFilterCardsUI();

  renderTable();

}


function updateFilterCardsUI(){

  document.querySelectorAll(
    ".stat-card"
  ).forEach(
    function(card){

      const isActive =
        activeFilter &&
        card.getAttribute(
          "data-filter"
        ) === activeFilter;

      card.classList.toggle(
        "active-filter",
        Boolean(
          isActive
        )
      );

      card.setAttribute(
        "aria-pressed",
        isActive
          ? "true"
          : "false"
      );

    }
  );

}


/* =========================================================
   MEDICATION SEARCH
========================================================= */

function renderMedicationOptions(
  filterText
){

  const box =
    document.getElementById(
      "medicineSearchOptions"
    );

  const q =
    String(
      filterText ||
      ""
    )
      .trim()
      .toLowerCase();

  const matches =
    q
      ? MEDICATIONS.filter(
          function(name){

            return name
              .toLowerCase()
              .includes(
                q
              );

          }
        )
      : MEDICATIONS;

  box.innerHTML =
    "";

  if (
    !matches.length
  ){

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "combo-empty";

    empty.innerText =
      text[currentLang].noMatches;

    box.appendChild(
      empty
    );

  }else{

    matches
      .slice(
        0,
        50
      )
      .forEach(
        function(name){

          const option =
            document.createElement(
              "div"
            );

          option.className =
            "combo-option";

          option.innerText =
            name;

          option.onmousedown =
            function(event){

              event.preventDefault();

              selectMedicationSearch(
                name
              );

            };

          box.appendChild(
            option
          );

        }
      );

  }

  box.style.display =
    "block";

}


function selectMedicationSearch(
  name
){

  const input =
    document.getElementById(
      "medicineSearch"
    );

  input.value =
    name;

  medicineSearchTerm =
    name.toLowerCase();

  document.getElementById(
    "medicineSearchOptions"
  ).style.display =
    "none";

  renderTable();

}


function matchesMedicineSearch(
  item
){

  if (
    !medicineSearchTerm
  ){

    return true;

  }

  return String(
    item.name ||
    ""
  )
    .toLowerCase()
    .includes(
      medicineSearchTerm
    );

}


/* =========================================================
   STATUS
========================================================= */

function statusLabel(
  daysLeft
){

  if (
    Number(
      daysLeft
    ) < 0
  ){

    return (
      Math.abs(
        Number(
          daysLeft
        )
      ) +
      text[currentLang].expiredSince
    );

  }

  return (
    text[currentLang].daysLeft +
    daysLeft
  );

}


function rowClass(item){

  const bucket =
    itemBucket(
      item
    );

  if (
    bucket === "expired"
  ){

    return "row-expired";

  }

  if (
    bucket === "soon"
  ){

    return "row-soon";

  }

  return "";

}


function dateClass(item){

  const bucket =
    itemBucket(
      item
    );

  if (
    bucket === "expired"
  ){

    return "date-expired";

  }

  if (
    bucket === "soon"
  ){

    return "date-soon";

  }

  return "date-ok";

}


function pillClass(item){

  return itemBucket(
    item
  );

}


/* =========================================================
   VISIBLE ITEMS
========================================================= */

function getVisibleItems(){

  return reportBaseItems().filter(
    function(item){

      const statusMatch =
        !activeFilter ||
        itemBucket(
          item
        ) === activeFilter;

      return (
        statusMatch &&
        matchesMedicineSearch(
          item
        )
      );

    }
  );

}


/* =========================================================
   TABLE
========================================================= */

function renderTable(){

  const tbody =
    document.getElementById(
      "tableBody"
    );

  const emptyNote =
    document.getElementById(
      "emptyNote"
    );

  tbody.innerHTML =
    "";

  const filtered =
    getVisibleItems();

  filtered.forEach(
    function(m){

      const tr =
        document.createElement(
          "tr"
        );

      tr.className =
        rowClass(
          m
        );

      tr.innerHTML =
        "<td>" +
        escapeHtml(
          m.name
        ) +
        "</td>" +

        "<td class=\"" +
        dateClass(
          m
        ) +
        "\">" +
        escapeHtml(
          m.expiry
        ) +
        "</td>" +

        "<td><span class=\"status-pill " +
        pillClass(
          m
        ) +
        "\">" +
        escapeHtml(
          statusLabel(
            m.daysLeft
          )
        ) +
        "</span></td>" +

        "<td>" +
        escapeHtml(
          m.registeredBy ||
          "-"
        ) +
        "</td>";

      tbody.appendChild(
        tr
      );

    }
  );

  emptyNote.style.display =
    filtered.length
      ? "none"
      : "block";

  emptyNote.innerText =
    text[currentLang].emptyNote;

}


function renderRows(items){

  lastItems =
    items ||
    [];

  let expired =
    0;

  let soon =
    0;

  let ok =
    0;

  reportBaseItems().forEach(
    function(m){

      const bucket =
        itemBucket(
          m
        );

      if (
        bucket === "expired"
      ){

        expired++;

      }else if (
        bucket === "soon"
      ){

        soon++;

      }else{

        ok++;

      }

    }
  );

  document.getElementById(
    "countExpired"
  ).textContent =
    expired;

  document.getElementById(
    "countSoon"
  ).textContent =
    soon;

  document.getElementById(
    "countOk"
  ).textContent =
    ok;

  renderTable();

}


/* =========================================================
   PRINT
========================================================= */

function printReport(){

  buildPrintPages();

  window.print();

}


function buildPrintPages(){

  const printPages =
    document.getElementById(
      "printPages"
    );

  printPages.innerHTML =
    "";

  const items =
    getVisibleItems();

  const ROWS_PER_PAGE =
    29;

  const pageCount =
    Math.max(
      1,
      Math.ceil(
        items.length /
        ROWS_PER_PAGE
      )
    );

  for (
    let pageIndex = 0;
    pageIndex < pageCount;
    pageIndex++
  ){

    const start =
      pageIndex *
      ROWS_PER_PAGE;

    const pageItems =
      items.slice(
        start,
        start +
        ROWS_PER_PAGE
      );

    printPages.appendChild(
      createPrintPage(
        pageItems,
        pageIndex + 1,
        pageCount
      )
    );

  }

}


function createPrintPage(
  pageItems,
  pageNumber,
  totalPages
){

  const page =
    document.createElement(
      "section"
    );

  page.className =
    "print-page";


  const header =
    document.createElement(
      "div"
    );

  header.className =
    "print-header";

  header.innerHTML =
    '<img class="print-logo" src="../../logo.png" alt="Logo">' +

    '<div class="print-official">' +

      '<h2>' +
      escapeHtml(
        text[currentLang].officialLine1
      ) +
      '</h2>' +

      '<h3>' +
      escapeHtml(
        text[currentLang].officialLine2
      ) +
      '</h3>' +

      '<h3>' +
      escapeHtml(
        text[currentLang].officialLine3
      ) +
      '</h3>' +

    '</div>';

  page.appendChild(
    header
  );


  const divider =
    document.createElement(
      "hr"
    );

  divider.className =
    "print-divider";

  page.appendChild(
    divider
  );


  const date =
    document.createElement(
      "div"
    );

  date.className =
    "print-date";

  date.innerText =
    document.getElementById(
      "dateBox"
    ).innerText;

  page.appendChild(
    date
  );


  const title =
    document.createElement(
      "div"
    );

  title.className =
    "print-title";

  title.innerText =
    document.getElementById(
      "pageTitle"
    ).innerText;

  page.appendChild(
    title
  );


  const tableWrap =
    document.createElement(
      "div"
    );

  tableWrap.className =
    "print-table-wrap";


  const table =
    document.createElement(
      "table"
    );

  table.className =
    "print-table";

  table.innerHTML =
    "<thead>" +
      "<tr>" +

        "<th>" +
        escapeHtml(
          text[currentLang].colName
        ) +
        "</th>" +

        "<th>" +
        escapeHtml(
          text[currentLang].colExpiry
        ) +
        "</th>" +

        "<th>" +
        escapeHtml(
          text[currentLang].colStatus
        ) +
        "</th>" +

        "<th>" +
        escapeHtml(
          text[currentLang].colEmployee
        ) +
        "</th>" +

      "</tr>" +
    "</thead>" +
    "<tbody></tbody>";


  const tbody =
    table.querySelector(
      "tbody"
    );


  if (
    !pageItems.length
  ){

    const tr =
      document.createElement(
        "tr"
      );

    tr.innerHTML =
      '<td colspan="4">' +
      escapeHtml(
        text[currentLang].emptyNote
      ) +
      '</td>';

    tbody.appendChild(
      tr
    );

  }else{

    pageItems.forEach(
      function(item){

        const tr =
          document.createElement(
            "tr"
          );

        tr.className =
          rowClass(
            item
          );

        tr.innerHTML =
          "<td>" +
          escapeHtml(
            item.name
          ) +
          "</td>" +

          "<td class=\"" +
          dateClass(
            item
          ) +
          "\">" +
          escapeHtml(
            item.expiry
          ) +
          "</td>" +

          "<td>" +
          escapeHtml(
            statusLabel(
              item.daysLeft
            )
          ) +
          "</td>" +

          "<td>" +
          escapeHtml(
            item.registeredBy ||
            "-"
          ) +
          "</td>";

        tbody.appendChild(
          tr
        );

      }
    );

  }


  tableWrap.appendChild(
    table
  );

  page.appendChild(
    tableWrap
  );


  const footer =
    document.createElement(
      "div"
    );

  footer.className =
    "print-footer";


  const pageNumberBox =
    document.createElement(
      "div"
    );

  pageNumberBox.className =
    "print-page-number";

  pageNumberBox.innerText =
    "Page " +
    pageNumber +
    " of " +
    totalPages;


  footer.appendChild(
    pageNumberBox
  );

  page.appendChild(
    footer
  );


  return page;

}


/* =========================================================
   REFRESH
========================================================= */

function refreshData(){

  activeFilter =
    null;

  updateFilterCardsUI();

  loadData();

}


function loadData(){

  fetch(
    API_URL +
    "?action=dashboard"
  )
    .then(
      function(response){

        return response.json();

      }
    )
    .then(
      function(data){

        renderRows(
          data.items ||
          data.medications ||
          []
        );

      }
    )
    .catch(
      function(){

        document.getElementById(
          "emptyNote"
        ).style.display =
          "block";

        document.getElementById(
          "emptyNote"
        ).innerText =
          text[currentLang].loadError;

      }
    );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   SEARCH EVENTS
========================================================= */

document.getElementById(
  "medicineSearch"
).addEventListener(
  "input",
  function(){

    medicineSearchTerm =
      this.value
        .trim()
        .toLowerCase();

    renderMedicationOptions(
      this.value
    );

    renderTable();

  }
);


document.getElementById(
  "medicineSearch"
).addEventListener(
  "focus",
  function(){

    renderMedicationOptions(
      this.value
    );

  }
);


document.addEventListener(
  "click",
  function(event){

    if (
      !event.target.closest(
        ".combo-wrap"
      )
    ){

      document.getElementById(
        "medicineSearchOptions"
      ).style.display =
        "none";

    }

  }
);


/* =========================================================
   START
========================================================= */

function init(){

  buildReportMonthOptions();

  setLanguage(
    "en"
  );

  loadData();

  setInterval(
    loadData,
    10000
  );

}


document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>
