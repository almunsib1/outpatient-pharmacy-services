<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Inspection Index</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#168fb3}
.container{max-width:980px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1);min-height:calc(100vh - 32px)}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;direction:ltr}
.logo{width:120px;height:120px;object-fit:contain}
.official-header{width:fit-content;max-width:100%;text-align:right;transform:translateY(14px);padding-left:8px;border-left:4px solid #168fb3;direction:rtl}
.official-header h2,.official-header h3{margin:2px 0;font-size:13px;line-height:1.4;color:#168fb3}
hr{border:none;border-top:1px solid #e5e7eb;margin:14px 0}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;direction:ltr}
.date-box{color:#168fb3;padding:4px 0;font-size:13px;font-weight:bold;text-align:center}
.language-chip{color:#168fb3;font-size:13px;font-weight:bold;padding:4px 0;white-space:nowrap;background:transparent;border:0;cursor:pointer;font-family:inherit}
.page-title{text-align:center;font-size:23px;font-weight:bold;margin:18px 0 10px;color:#168fb3}
.report-controls{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 16px;flex-wrap:wrap;direction:ltr}
.report-controls select{width:auto;min-width:178px;height:34px;padding:5px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#168fb3;font-size:13px;font-weight:bold;font-family:inherit;text-align:center;direction:ltr}
.stats{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;justify-content:center}
.stat-card{display:grid;justify-items:center;gap:4px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.04);padding:10px 18px;min-width:118px;min-height:52px;text-align:center;cursor:pointer;transition:.15s ease;user-select:none}
.stat-card .num{font-size:20px;font-weight:bold;line-height:1}
.stat-card .label{font-size:13px;color:#168fb3;font-weight:bold}
.stat-card.red .num{color:#a12727}
.stat-card.orange .num{color:#eab308}
.stat-card.green .num{color:#0f7592}
.stat-card:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.08)}
.stat-card.active-filter{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.08)}
.stat-card.red.active-filter{background:#fdeaea;border-color:#a12727}
.stat-card.orange.active-filter{background:#fff6e0;border-color:#eab308}
.stat-card.green.active-filter{background:#e6f2f5;border-color:#0f7592}
.search-row{display:flex;justify-content:center;margin:-4px auto 16px;position:relative;max-width:360px}.medicine-search{width:100%;height:36px;border:1px solid #cbd5e1;border-radius:8px;padding:6px 12px;background:#fff;color:#168fb3;font-size:13px;font-weight:bold;text-align:center;font-family:inherit}.medicine-search::placeholder{color:#94a3b8;font-weight:normal}.action-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;direction:ltr}
.action-btn{width:44px;min-width:44px;min-height:44px;padding:0;border:0;border-radius:0;background:transparent;color:#168fb3;font-size:26px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.action-btn:hover{background:transparent;transform:scale(1.08)}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid #e5e7eb;box-shadow:0 4px 10px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:9px 10px;text-align:center;font-size:13px;white-space:nowrap;border-bottom:1px solid #e5e7eb}
th{background:#168fb3;color:#fff;font-weight:bold;font-size:14px}
tr:last-child td{border-bottom:0}
.row-expired{background:#fdeaea !important}
.row-soon{background:#fff6e0 !important}
.date-expired{color:#a12727;font-weight:bold}
.date-soon{color:#eab308;font-weight:bold}
.date-ok{color:#0f7592;font-weight:bold}
.status-pill{display:inline-flex;align-items:center;justify-content:center;min-height:24px;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:bold;white-space:nowrap}
.status-pill.expired{background:rgba(161,39,39,.12);color:#a12727}
.status-pill.soon{background:rgba(234,179,8,.2);color:#a16207}
.status-pill.ok{background:rgba(15,117,146,.12);color:#0f7592}
.empty-note,.refresh-note{text-align:center;font-size:12px;color:#888;margin-top:10px}
.main-home-link{display:flex;align-items:center;justify-content:center;width:fit-content;margin:22px auto 0;color:#168fb3;text-decoration:none;font-size:28px;line-height:1;background:transparent;border:none;padding:4px}
.main-home-link:hover{color:#0f7592}
@media (max-width:700px){body{padding:10px;background:#fff}.container{padding:14px;border-radius:0;box-shadow:none;min-height:100vh}.logo{width:84px;height:84px}.official-header{transform:translateY(10px)}.official-header h2,.official-header h3{font-size:12px}.page-title{font-size:20px;margin-bottom:10px}.report-controls{gap:8px;margin-bottom:14px}.report-controls select{min-width:150px;font-size:12px}.stat-card{min-width:96px;padding:8px 12px}.stat-card .num{font-size:18px}.search-row{max-width:280px;margin-bottom:14px}.medicine-search{height:34px;font-size:12px}th,td{padding:8px 8px;font-size:12px}.action-btn{width:40px;min-width:40px;min-height:40px;font-size:22px}}
@media print{.language-chip,.main-home-link,.action-row,.refresh-note,.report-controls,.search-row{display:none !important}body{background:#fff;padding:0}.container{max-width:none;width:100%;min-height:auto;margin:0;padding:18px 22px;border:1px solid #dbe7ed;border-radius:8px;box-shadow:none}.logo{width:82px;height:82px}.official-header{transform:none}.official-header h2,.official-header h3{font-size:11px}.page-title{font-size:22px;margin:10px 0 4px}.meta-row{justify-content:center;margin-bottom:8px}.date-box{font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}.stat-card{box-shadow:none;min-height:58px;padding:8px 10px}.table-wrap{box-shadow:none;border-radius:8px}th{font-size:12px}td{font-size:11px;padding:7px 8px}}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <img class="logo" src="../../logo.png" alt="Logo">
    <div class="official-header">
      <h2 id="officialLine1">تجمع المدينة المنورة الصحي</h2>
      <h3 id="officialLine2">مستشفى الملك فهد بالمدينة المنورة</h3>
      <h3 id="officialLine3">إدارة الرعاية الصيدلانية</h3>
    </div>
  </div>
  <hr>
  <div class="meta-row">
    <div class="date-box" id="dateBox"></div>
    <button type="button" class="language-chip" id="languageToggle" onclick="toggleLanguage()">🌐 ع | E</button>
  </div>

  <h1 class="page-title" id="pageTitle">Monthly Inspection Index</h1>

  <div class="report-controls">
    <select id="reportType" onchange="refreshReportView()">
      <option value="inspection">Inspection Report</option>
      <option value="removal">Expiry Removal Report</option>
    </select>
    <select id="reportMonth" onchange="refreshReportView()"></select>
  </div>

  <div class="stats">
    <div class="stat-card red" id="cardExpired" data-filter="expired" role="button" tabindex="0" aria-pressed="false" onclick="setFilter('expired')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setFilter('expired');}"><div class="label" id="labelExpired">هذا الشهر</div><div class="num" id="countExpired">-</div></div>
    <div class="stat-card orange" id="cardSoon" data-filter="soon" role="button" tabindex="0" aria-pressed="false" onclick="setFilter('soon')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setFilter('soon');}"><div class="label" id="labelSoon">خلال 3 أشهر</div><div class="num" id="countSoon">-</div></div>
    <div class="stat-card green" id="cardOk" data-filter="ok" role="button" tabindex="0" aria-pressed="false" onclick="setFilter('ok')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setFilter('ok');}"><div class="label" id="labelOk">ضمن المدة الآمنة</div><div class="num" id="countOk">-</div></div>
  </div>

  <div class="search-row">
    <input class="medicine-search" id="medicineSearch" list="medicineSearchOptions" autocomplete="off" oninput="setMedicineSearch(this.value)">
    <datalist id="medicineSearchOptions"></datalist>
  </div>

  <div class="action-row">
    <button type="button" class="action-btn" id="printBtn" onclick="window.print()" title="طباعة" aria-label="طباعة">🖨️</button>
    <button type="button" class="action-btn" id="refreshBtn" onclick="refreshData()" title="تحديث" aria-label="تحديث">🔄</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th id="colName">اسم الدواء</th>
          <th id="colExpiry">تاريخ الانتهاء</th>
          <th id="colStatus">الحالة</th>
          <th id="colEmployee">اسم الموظف</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="empty-note" id="emptyNote" style="display:none">لا توجد بيانات لعرضها حالياً.</div>
  <div class="refresh-note" id="refreshNote">يتحدث تلقائياً كل 10 ثواني</div>
</div>

<script>
// TODO: ضع رابط Google Apps Script Web App هنا بعد النشر (ينتهي بـ /exec)
// نفس الرابط المستخدم في form.html وadmin.html لهذا المشروع.
const API_URL = "https://script.google.com/macros/s/AKfycbxtrOZPua0dmMEtXCHJQ7wCZnp6OPiKVurOOL8YG_Ma1mPMhgmzWFadYGxWV4CDejgcIw/exec";

let currentLang = "en";
const text = {
  ar: {
    title:"مؤشر المتابعة الشهري لصلاحية الأدوية",
    inspectionReport:"Inspection Report",
    removalReport:"Expiry Removal Report",
    officialLine1:"تجمع المدينة المنورة الصحي",
    officialLine2:"مستشفى الملك فهد بالمدينة المنورة",
    officialLine3:"إدارة الرعاية الصيدلانية",
    labelExpired:"هذا الشهر",
    labelSoon:"خلال 3 أشهر",
    labelOk:"ضمن المدة الآمنة",
    colName:"اسم الدواء",
    colExpiry:"تاريخ الانتهاء",
    colStatus:"الحالة",
    colEmployee:"اسم الموظف",
    printBtnText:"طباعة",
    refreshBtnText:"تحديث",
    refreshNote:"يتحدث تلقائياً كل 10 ثواني",
    searchPlaceholder:"بحث باسم الدواء",
emptyNote:"لا توجد بيانات لعرضها حالياً.",
    notConfigured:"لم يتم ربط مصدر البيانات بعد.",
    loadError:"تعذر تحميل البيانات، حاول لاحقاً.",
    expiredSince:" يوم منتهي منذ ",
    daysLeft:" يوم متبقي ",
    back:"العودة إلى صيدلية مركز الكلى"
  },
  en: {
    title:"Monthly Inspection Index",
    inspectionReport:"Inspection Report",
    removalReport:"Expiry Removal Report",
    officialLine1:"Madinah Health Cluster",
    officialLine2:"King Fahad Hospital - Madinah",
    officialLine3:"Pharmaceutical Care Administration",
    labelExpired:"This Month",
    labelSoon:"Within 3 Months",
    labelOk:"Within Safe Range",
    colName:"Medication Name",
    colExpiry:"Expiry Date",
    colStatus:"Status",
    colEmployee:"Employee Name",
    printBtnText:"Print",
    refreshBtnText:"Refresh",
    refreshNote:"Auto-refreshes every 10 seconds",
    searchPlaceholder:"Search by medication name",
emptyNote:"No data to display yet.",
    notConfigured:"Data source is not connected yet.",
    loadError:"Could not load data, try again later.",
    expiredSince:" days expired",
    daysLeft:"Days left: ",
    back:"Back to Kidney Center Pharmacy"
  }
};

function setLanguage(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = text[lang].title;
  document.getElementById("pageTitle").innerText = text[lang].title;
  ["officialLine1","officialLine2","officialLine3","labelExpired","labelSoon","labelOk","colName","colExpiry","colStatus","colEmployee","refreshNote"].forEach(id=>{
    const key = id.replace("pageTitle","title");
    document.getElementById(id).innerText = text[lang][key];
  });
  document.getElementById("printBtn").title = text[lang].printBtnText;
  document.getElementById("printBtn").setAttribute("aria-label", text[lang].printBtnText);
  document.getElementById("refreshBtn").title = text[lang].refreshBtnText;
  document.getElementById("refreshBtn").setAttribute("aria-label", text[lang].refreshBtnText);
  const reportType = document.getElementById("reportType");
  if (reportType) {
    reportType.options[0].textContent = text[lang].inspectionReport;
    reportType.options[1].textContent = text[lang].removalReport;
  }
  const homeLink = document.querySelector(".main-home-link");
  if (homeLink) {
    homeLink.title = text[lang].back;
    homeLink.setAttribute("aria-label", text[lang].back);
  }
  document.getElementById("languageToggle").innerText = "🌐 ع | E";
  document.getElementById("medicineSearch").placeholder = text[lang].searchPlaceholder;
  renderDate();
  renderRows(lastItems);
}
function toggleLanguage(){ setLanguage(currentLang === "ar" ? "en" : "ar"); }
function renderDate(){
  const now = new Date();
  const date = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh"}).format(now);
  const dayName = new Intl.DateTimeFormat(currentLang === "ar" ? "ar-SA" : "en-US",{timeZone:"Asia/Riyadh",weekday:"long"}).format(now);
  document.getElementById("dateBox").innerText = `${dayName} - ${date}`;
}

function buildReportMonthOptions(){
  const select = document.getElementById("reportMonth");
  if (!select || select.options.length) return;
  const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const today = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh"}).format(new Date());
  const currentYear = Number(today.substring(0, 4));
  const defaultMonth = getNextMonthValue();
  for (let year = currentYear - 1; year <= currentYear + 1; year++) {
    monthNames.forEach(function(monthName, index){
      const monthNumber = String(index + 1).padStart(2, "0");
      const value = year + "-" + monthNumber;
      const option = document.createElement("option");
      option.value = value;
      option.textContent = monthName + " " + year;
      select.appendChild(option);
    });
  }
  select.value = defaultMonth;
}

function getNextMonthValue(){
  const today = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh"}).format(new Date());
  const parts = today.split("-");
  let year = Number(parts[0]);
  let month = Number(parts[1]) + 1;
  if (month > 12) { month = 1; year += 1; }
  return year + "-" + String(month).padStart(2, "0");
}

function getReportMonth(){
  const select = document.getElementById("reportMonth");
  return select && select.value ? select.value : getNextMonthValue();
}

function getReportType(){
  const select = document.getElementById("reportType");
  return select && select.value ? select.value : "inspection";
}

function getReportMonthLabel(){
  const select = document.getElementById("reportMonth");
  return select && select.selectedOptions.length ? select.selectedOptions[0].textContent : getReportMonth();
}

function updateReportTitle(){
  document.getElementById("pageTitle").innerText = text[currentLang].title;
}

function refreshReportView(){
  activeFilter = null;
  updateReportTitle();
  renderRows(lastItems);
}

function reportBaseItems(){
  const month = getReportMonth();
  const reportType = getReportType();
  return lastItems.filter(function(item){
    const itemMonth = String(item.expiry || "").substring(0, 7);
    if (reportType === "removal") return itemMonth === month;
    return itemMonth >= month;
  });
}
function statusLabel(daysLeft){
  if (daysLeft < 0) return Math.abs(daysLeft) + text[currentLang].expiredSince;
  return text[currentLang].daysLeft + daysLeft;
}
function rowClass(item){
  const bucket = itemBucket(item);
  if (bucket === "expired") return "row-expired";
  if (bucket === "soon") return "row-soon";
  return "";
}
function dateClass(item){
  const bucket = itemBucket(item);
  if (bucket === "expired") return "date-expired";
  if (bucket === "soon") return "date-soon";
  return "date-ok";
}
function pillClass(item){
  return itemBucket(item);
}

let lastItems = [];
let activeFilter = null;
let medicineSearchQuery = "";

function getTodayParts(){
  const today = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Riyadh"}).format(new Date());
  const parts = today.split("-");
  return { year: parts[0], month: parts[1] };
}

function isThisMonth(expiry){
  const parts = String(expiry || "").split("-");
  if (parts.length < 2) return false;
  const today = getTodayParts();
  return parts[0] === today.year && parts[1] === today.month;
}

function itemBucket(item){
  const itemMonth = String(item.expiry || "").substring(0, 7);
  const reportMonth = getReportMonth();
  if (getReportType() === "removal") return "expired";
  if (itemMonth === reportMonth) return "expired";
  const distance = monthDistance(reportMonth, itemMonth);
  if (distance > 0 && distance <= 3) return "soon";
  return "ok";
}

function monthDistance(fromMonth, toMonth){
  const from = String(fromMonth || "").split("-");
  const to = String(toMonth || "").split("-");
  if (from.length < 2 || to.length < 2) return 999;
  return ((Number(to[0]) - Number(from[0])) * 12) + (Number(to[1]) - Number(from[1]));
}

function matchesFilter(item){
  if (!activeFilter) return true;
  return itemBucket(item) === activeFilter;
}

function setMedicineSearch(value){
  medicineSearchQuery = String(value || "").trim().toLowerCase();
  renderTable();
}

function matchesMedicineSearch(item){
  if (!medicineSearchQuery) return true;
  return String(item.name || "").toLowerCase().includes(medicineSearchQuery);
}

function renderMedicineSearchOptions(){
  const list = document.getElementById("medicineSearchOptions");
  if (!list) return;
  const names = Array.from(new Set(reportBaseItems().map(function(item){ return item.name; }).filter(Boolean))).sort(function(a,b){ return a.localeCompare(b); });
  list.innerHTML = names.map(function(name){ return "<option value=\"" + escapeHtml(name) + "\"></option>"; }).join("");
}

function escapeHtml(value){
  return String(value || "").replace(/[&<>\"]/g, function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch];
  });
}

function setFilter(status){
  activeFilter = (activeFilter === status) ? null : status;
  updateFilterCardsUI();
  renderTable();
}

function updateFilterCardsUI(){
  document.querySelectorAll(".stat-card").forEach(function(card){
    const isActive = activeFilter && card.getAttribute("data-filter") === activeFilter;
    card.classList.toggle("active-filter", !!isActive);
    card.setAttribute("aria-pressed", isActive ? "true" : "false");
  });
}

function renderTable(){
  const tbody = document.getElementById("tableBody");
  const emptyNote = document.getElementById("emptyNote");
  tbody.innerHTML = "";
  const filtered = reportBaseItems().filter(function(m){ return matchesFilter(m) && matchesMedicineSearch(m); });
  filtered.forEach(function(m){
    const tr = document.createElement("tr");
    tr.className = rowClass(m);
    tr.innerHTML =
      "<td>" + m.name + "</td>" +
      "<td class=\"" + dateClass(m) + "\">" + m.expiry + "</td>" +
      "<td><span class=\"status-pill " + pillClass(m) + "\">" + statusLabel(m.daysLeft) + "</span></td>" +
      "<td>" + (m.registeredBy || "-") + "</td>";
    tbody.appendChild(tr);
  });
  emptyNote.style.display = filtered.length ? "none" : "block";
  emptyNote.innerText = text[currentLang].emptyNote;
}

function renderRows(items){
  lastItems = items || [];
  let expired = 0, soon = 0, ok = 0;
  reportBaseItems().forEach(function(m){
    const bucket = itemBucket(m);
    if (bucket === "expired") expired++;
    else if (bucket === "soon") soon++;
    else ok++;
  });
  document.getElementById("countExpired").textContent = expired;
  document.getElementById("countSoon").textContent = soon;
  document.getElementById("countOk").textContent = ok;
  renderMedicineSearchOptions();
  renderTable();
}

function refreshData(){
  activeFilter = null;
  updateFilterCardsUI();
  renderTable();
  loadData();
}

function loadData(){
  if (!API_URL){
    document.getElementById("emptyNote").style.display = "block";
    document.getElementById("emptyNote").innerText = text[currentLang].notConfigured;
    return;
  }
  fetch(API_URL + "?action=dashboard")
    .then(function(res){ return res.json(); })
    .then(function(data){
      renderRows(data.items || data.medications || []);
    })
    .catch(function(){
      document.getElementById("emptyNote").style.display = "block";
      document.getElementById("emptyNote").innerText = text[currentLang].loadError;
    });
}

buildReportMonthOptions();
setLanguage("en");
loadData();
setInterval(loadData, 10000);
</script>
</body>
</html>
