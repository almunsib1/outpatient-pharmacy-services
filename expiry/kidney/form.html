<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Inspection</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:16px;
  color:#168fb3
}

.container{
  max-width:640px;
  margin:auto;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  min-height:calc(100vh - 32px)
}

.top-bar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
  direction:ltr
}

.logo{
  width:120px;
  height:120px;
  object-fit:contain
}

.official-header{
  width:fit-content;
  max-width:100%;
  text-align:right;
  transform:translateY(14px);
  padding-left:8px;
  border-left:4px solid #168fb3;
  direction:rtl
}

.official-header h2,
.official-header h3{
  margin:2px 0;
  font-size:13px;
  line-height:1.4;
  color:#168fb3
}

hr{
  border:none;
  border-top:1px solid #e5e7eb;
  margin:14px 0
}

.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
  direction:ltr
}

.date-box{
  color:#168fb3;
  padding:4px 0;
  font-size:13px;
  font-weight:bold;
  text-align:center
}

.language-chip{
  color:#168fb3;
  font-size:13px;
  font-weight:bold;
  padding:4px 0;
  white-space:nowrap;
  background:transparent;
  border:0;
  cursor:pointer;
  font-family:inherit
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:18px auto 22px;
  flex-wrap:wrap
}

.page-title{
  text-align:center;
  font-size:23px;
  font-weight:bold;
  margin:0;
  color:#168fb3
}

label{
  font-weight:bold;
  display:block;
  margin-bottom:2px;
  color:#111827;
  font-size:12px
}

input,
select{
  width:100%;
  height:34px;
  padding:6px 9px;
  margin-top:4px;
  margin-bottom:10px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:13px;
  background:#fff;
  text-align:start;
  font-family:inherit
}

#medName{
  direction:ltr;
  text-align:left
}

.expiry-row{
  display:grid;
  grid-template-columns:80px minmax(120px,1fr) 95px;
  gap:7px;
  direction:ltr;
  margin-top:4px;
  margin-bottom:10px
}

.expiry-row select{
  width:100%;
  margin:0;
  text-align:center;
  direction:ltr;
  color:#111827;
  font-weight:600
}

.primary-btn{
  padding:9px 18px;
  background:#168fb3;
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  font-family:inherit
}

.primary-btn:hover{filter:brightness(1.05)}
.primary-btn:disabled{background:#94a3b8;cursor:not-allowed}

.secondary-btn{
  border:1px solid #cbd5e1;
  background:#fff;
  cursor:pointer;
  font-size:13px;
  font-weight:bold;
  color:#168fb3;
  padding:7px 10px;
  border-radius:8px;
  font-family:inherit
}

.secondary-btn:hover{background:#f9fafb}

.login-card{
  max-width:280px;
  margin:16px auto 0;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:16px
}

.login-actions{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:fit-content;
  margin:4px auto 0
}

.login-actions .primary-btn,
.login-actions .secondary-btn{
  width:40px;
  height:40px;
  margin:0;
  padding:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  line-height:1
}

.login-svg{
  width:20px;
  height:20px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round
}

.change-password-panel{
  display:none;
  border-top:1px solid #e5e7eb;
  margin-top:14px;
  padding-top:14px
}

.employee-toolbar{
  display:grid;
  grid-template-columns:36px auto 36px;
  align-items:center;
  justify-content:center;
  gap:14px;
  background:transparent;
  border:none;
  border-radius:0;
  padding:4px 0 2px;
  margin:8px auto 18px;
  color:#168fb3;
  text-align:center
}

.employee-name{
  font-weight:bold;
  color:#168fb3;
  font-size:24px;
  line-height:1.2;
  grid-column:2;
  white-space:nowrap
}

.logout-icon{
  width:34px;
  height:34px;
  padding:0;
  border:none;
  background:transparent;
  color:#168fb3;
  font-size:0;
  line-height:1;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border-radius:0;
  grid-column:1;
  grid-row:1
}

.logout-icon:hover{
  background:transparent;
  transform:scale(1.06)
}

.power-svg{
  width:30px;
  height:30px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:2.35;
  stroke-linecap:round;
  stroke-linejoin:round
}

.form-panel{
  width:min(100%,360px);
  margin:0 auto;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:16px
}

.combo-wrap{
  position:relative;
  width:100%;
  margin:0 auto
}

.combo-options{
  position:absolute;
  top:100%;
  right:0;
  left:0;
  background:#fff;
  border:1px solid #cbd5e1;
  border-radius:8px;
  margin-top:-6px;
  max-height:190px;
  overflow-y:auto;
  box-shadow:0 10px 20px rgba(0,0,0,.1);
  z-index:20;
  display:none
}

.combo-option{
  padding:8px 10px;
  font-size:13px;
  cursor:pointer;
  text-align:left;
  direction:ltr
}

.combo-option:hover,
.combo-option.active{
  background:#e0f2fe
}

.combo-empty{
  padding:9px 12px;
  font-size:12px;
  color:#94a3b8
}

.form-actions{
  display:flex;
  justify-content:center;
  margin-top:4px
}

.conflict-box{
  display:none;
  background:#fff6e0;
  border:1px solid #eab308;
  border-radius:8px;
  padding:12px 14px;
  margin-bottom:14px;
  font-size:13px;
  color:#7c5a00
}

.conflict-box ul{
  margin:8px 0;
  padding-inline-start:18px
}

.conflict-actions{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:10px
}

.conflict-actions button{min-width:120px}

.conflict-actions .danger-btn{
  background:#eab308;
  color:#111827;
  border:none;
  border-radius:8px;
  padding:8px 14px;
  font-weight:bold;
  font-size:13px;
  cursor:pointer;
  font-family:inherit
}

#result,
#loginResult{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-size:13px
}

#result.error,
#loginResult.error{
  display:block;
  background:#fef2f2;
  color:#991b1b
}

#result.success,
#loginResult.success{
  display:block;
  background:#ecfdf5;
  color:#065f46
}

.back-button{
  width:34px;
  height:34px;
  margin:0;
  padding:0;
  border:0;
  background:transparent;
  color:#168fb3;
  font-size:28px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-family:Arial,sans-serif;
  border-radius:0;
  grid-column:3;
  grid-row:1
}

.back-button:hover{
  background:transparent;
  color:#0f7592;
  transform:translateX(-1px)
}

@media (max-width:700px){
  .back-button{width:34px;height:34px;margin-bottom:6px;font-size:28px}
  body{padding:10px;background:#fff}
  .container{padding:14px;border-radius:0;box-shadow:none;min-height:100vh}
  .logo{width:84px;height:84px}
  .official-header{transform:translateY(10px)}
  .official-header h2,.official-header h3{font-size:12px}
  .title-row{gap:8px;margin-bottom:20px}
  .page-title{font-size:20px}
  .employee-toolbar{gap:10px;margin:8px auto 16px}
  .employee-name{font-size:22px}
  .logout-icon{width:32px;height:32px}
  .power-svg{width:28px;height:28px}
  .form-panel{width:min(100%,320px);padding:14px}

  .expiry-row{
    grid-template-columns:68px minmax(110px,1fr) 84px;
    gap:6px
  }

  .expiry-row select{
    padding:5px 4px;
    font-size:12px
  }

  .login-actions .primary-btn,
  .login-actions .secondary-btn{
    width:44px!important;
    height:44px!important
  }
}
</style>

<body>

<div class="container">

  <div class="top-bar">
    <img class="logo" src="../../logo.png" alt="Logo">

    <div class="official-header">
      <h2 id="officialLine1">تجمع المدينة المنورة الصحي</h2>
      <h3 id="officialLine2">مستشفى الملك فهد بالمدينة المنورة</h3>
      <h3 id="officialLine3">إدارة الرعاية الصيدلانية</h3>
    </div>
  </div>

  <hr>

  <div class="meta-row">
    <div class="date-box" id="dateBox"></div>

    <button
      type="button"
      class="language-chip"
      id="languageToggle"
      onclick="toggleLanguage()">
      🌐 ع | E
    </button>
  </div>

  <div class="title-row">
    <h1 class="page-title" id="pageTitle">Monthly Inspection</h1>
  </div>

  <div id="loginView" class="login-card">

    <label id="usernameLabel" for="username">اسم المستخدم</label>
    <input type="text" id="username" autocomplete="username">

    <label id="passwordLabel" for="password">PIN</label>
    <input type="password" id="password" inputmode="numeric" autocomplete="current-password">

    <div class="login-actions">

      <button
        type="button"
        class="primary-btn"
        id="loginBtn"
        onclick="loginEmployee()"
        title="تسجيل الدخول"
        aria-label="تسجيل الدخول">

        <svg class="login-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path>
        </svg>

      </button>

      <button
        type="button"
        class="secondary-btn"
        id="togglePasswordBtn"
        onclick="togglePasswordPanel()"
        title="تغيير PIN"
        aria-label="تغيير PIN">
        🔑
      </button>

    </div>

    <div class="change-password-panel" id="changePasswordPanel">

      <label id="changeUsernameLabel" for="changeUsername">اسم المستخدم</label>
      <input type="text" id="changeUsername" autocomplete="username">

      <label id="oldPasswordLabel" for="oldPassword">PIN الحالي</label>
      <input type="password" id="oldPassword" autocomplete="current-password">

      <label id="newPasswordLabel" for="newPassword">PIN الجديد</label>
      <input type="password" id="newPassword" autocomplete="new-password">

      <button
        type="button"
        class="primary-btn"
        id="changePasswordBtn"
        onclick="changePassword()">
        تغيير PIN
      </button>

    </div>

    <div id="loginResult"></div>

  </div>

  <div id="employeeView" style="display:none">

    <div class="employee-toolbar">

      <button
        type="button"
        class="back-button"
        onclick="history.back()"
        title="رجوع"
        aria-label="رجوع">
        ↩
      </button>

      <span class="employee-name" id="employeeName"></span>

      <button
        type="button"
        class="logout-icon"
        id="logoutBtn"
        onclick="logoutEmployee()"
        title="تسجيل الخروج"
        aria-label="تسجيل الخروج">

        <svg class="power-svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v9"></path>
          <path d="M7.1 6.8a8 8 0 1 0 9.8 0"></path>
        </svg>

      </button>

    </div>

    <div class="conflict-box" id="conflictBox">

      <div id="conflictText"></div>
      <ul id="conflictList"></ul>

      <div class="conflict-actions">

        <button
          type="button"
          class="danger-btn"
          id="confirmSaveBtn"
          onclick="confirmSave()">
          متابعة الحفظ رغم ذلك
        </button>

        <button
          type="button"
          class="secondary-btn"
          id="cancelConflictBtn"
          onclick="cancelConflict()">
          إلغاء
        </button>

      </div>

    </div>

    <div class="form-panel">

      <label id="medNameLabel" for="medName">اسم الدواء</label>

      <div class="combo-wrap">

        <input
          type="text"
          id="medName"
          autocomplete="off"
          dir="ltr"
          lang="en"
          inputmode="text"
          pattern="[A-Za-z0-9\s\-_/().,+%]*">

        <div class="combo-options" id="medNameOptions"></div>

      </div>

      <label id="medExpiryLabel">تاريخ الانتهاء</label>

      <div class="expiry-row">

        <select id="expiryDay" aria-label="Day">
          <option value="">Day</option>
        </select>

        <select id="expiryMonth" aria-label="Month">
          <option value="">Month</option>
          <option value="01">January</option>
          <option value="02">February</option>
          <option value="03">March</option>
          <option value="04">April</option>
          <option value="05">May</option>
          <option value="06">June</option>
          <option value="07">July</option>
          <option value="08">August</option>
          <option value="09">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>

        <select id="expiryYear" aria-label="Year">
          <option value="">Year</option>
        </select>

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="primary-btn"
          id="submitBtn"
          onclick="submitMedication()">
          تسجيل
        </button>

      </div>

    </div>

    <div id="result"></div>

  </div>

</div>

function migrateOldSession(){

  const oldToken =
    sessionStorage.getItem(
      KIDNEY_SESSION_TOKEN_KEY
    );

  const oldName =
    sessionStorage.getItem(
      KIDNEY_SESSION_NAME_KEY
    );

  const oldUsername =
    sessionStorage.getItem(
      KIDNEY_SESSION_USERNAME_KEY
    );


  if (
    oldToken &&
    !localStorage.getItem(
      KIDNEY_SESSION_TOKEN_KEY
    )
  ) {
    localStorage.setItem(
      KIDNEY_SESSION_TOKEN_KEY,
      oldToken
    );
  }


  if (
    oldName &&
    !localStorage.getItem(
      KIDNEY_SESSION_NAME_KEY
    )
  ) {
    localStorage.setItem(
      KIDNEY_SESSION_NAME_KEY,
      oldName
    );
  }


  if (
    oldUsername &&
    !localStorage.getItem(
      KIDNEY_SESSION_USERNAME_KEY
    )
  ) {
    localStorage.setItem(
      KIDNEY_SESSION_USERNAME_KEY,
      oldUsername
    );
  }

}

/* =========================================================
   EXPIRY DATE
========================================================= */

function buildExpirySelectors(){

  const daySelect =
    document.getElementById(
      "expiryDay"
    );

  const yearSelect =
    document.getElementById(
      "expiryYear"
    );


  for (
    let day = 1;
    day <= 31;
    day++
  ) {

    const value =
      String(day).padStart(
        2,
        "0"
      );

    const option =
      document.createElement(
        "option"
      );

    option.value =
      value;

    option.textContent =
      value;

    daySelect.appendChild(
      option
    );
  }


  const currentYear =
    Number(
      new Intl.DateTimeFormat(
        "en",
        {
          timeZone:"Asia/Riyadh",
          year:"numeric"
        }
      ).format(
        new Date()
      )
    );


  for (
    let year = currentYear;
    year <= currentYear + 15;
    year++
  ) {

    const option =
      document.createElement(
        "option"
      );

    option.value =
      String(year);

    option.textContent =
      String(year);

    yearSelect.appendChild(
      option
    );
  }

}


function getExpiryDate(){

  const day =
    document.getElementById(
      "expiryDay"
    ).value;

  const month =
    document.getElementById(
      "expiryMonth"
    ).value;

  const year =
    document.getElementById(
      "expiryYear"
    ).value;


  if (
    !day ||
    !month ||
    !year
  ) {
    return "";
  }


  const expiry =
    year +
    "-" +
    month +
    "-" +
    day;


  const check =
    new Date(
      year +
      "-" +
      month +
      "-" +
      day +
      "T12:00:00"
    );


  if (
    Number.isNaN(
      check.getTime()
    ) ||
    check.getFullYear() !== Number(year) ||
    check.getMonth() + 1 !== Number(month) ||
    check.getDate() !== Number(day)
  ) {
    return "";
  }


  return expiry;
}

async function loginEmployee(){

  const username =
    document.getElementById(
      "username"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value.trim();


  if (
    !username ||
    !password
  ) {

    showLoginResult(
      "error",
      text[currentLang].invalidLogin
    );

    return;
  }


  try {

    const result =
      await postApi(
        "employeeLogin",
        {
          username:username,
          password:password,
          pin:password
        },
        false
      );


    if (
      !result.success ||
      !result.employee ||
      !result.sessionToken
    ) {

      showLoginResult(
        "error",
        text[currentLang].invalidLogin +
        diagnosticText(
          result
        )
      );

      return;
    }


    currentEmployeeName =
      result.employee.name ||
      result.employee.username ||
      username;


    currentEmployeeUsername =
      result.employee.username ||
      username;


    currentSessionToken =
      result.sessionToken;


    saveStoredSession();

    clearLoginResult();


    document.getElementById(
      "password"
    ).value =
      "";


    showEmployeeView();

  } catch(error){

    showLoginResult(
      "error",
      text[currentLang].invalidLogin +
      " [NETWORK_ERROR]"
    );

  }

}

   RESTORE SESSION
========================================================= */

async function restoreSession(){

  currentSessionToken =
    localStorage.getItem(
      KIDNEY_SESSION_TOKEN_KEY
    ) || "";


  currentEmployeeName =
    localStorage.getItem(
      KIDNEY_SESSION_NAME_KEY
    ) || "";


  currentEmployeeUsername =
    localStorage.getItem(
      KIDNEY_SESSION_USERNAME_KEY
    ) || "";


  if (
    !currentSessionToken
  ) {

    clearStoredSession();

    showLoginView();

    return;
  }


  try {

    const result =
      await postApi(
        "validateSession",
        {
          service:"kidney"
        },
        true
      );


    if (
      !result.success ||
      !result.user
    ) {

      clearStoredSession();

      showLoginView();

      return;
    }


    currentEmployeeUsername =
      result.user.username ||
      currentEmployeeUsername;


    currentEmployeeName =
      result.user.name ||
      result.user.username ||
      currentEmployeeName;


    saveStoredSession();

    showEmployeeView();

  } catch(error){

    clearStoredSession();

    showLoginView();

  }

}

function startInactivityWatcher(){

  if (
    !inactivityWatcherStarted
  ) {

    [
      "click",
      "keydown",
      "touchstart",
      "mousemove"
    ].forEach(
      function(eventName){

        window.addEventListener(
          eventName,
          resetInactivityTimer,
          {
            passive:true
          }
        );

      }
    );

    inactivityWatcherStarted =
      true;
  }

  resetInactivityTimer();
}


function resetInactivityTimer(){

  window.clearTimeout(
    inactivityTimer
  );

  inactivityTimer =
    window.setTimeout(
      function(){

        if (
          currentSessionToken
        ) {
          logoutEmployee();
        }

      },
      INACTIVITY_LIMIT_MS
    );

}

function renderMedOptions(
  filterText
){

  const box =
    document.getElementById(
      "medNameOptions"
    );


  const q =
    (
      filterText ||
      ""
    )
      .trim()
      .toLowerCase();


  const matches =
    q
      ? MEDICATIONS.filter(
          function(m){
            return m
              .toLowerCase()
              .includes(
                q
              );
          }
        )
      : MEDICATIONS;


  box.innerHTML =
    "";


  if (
    !matches.length
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "combo-empty";

    empty.innerText =
      text[currentLang].noMatches;

    box.appendChild(
      empty
    );

  } else {

    matches
      .slice(
        0,
        50
      )
      .forEach(
        function(name){

          const opt =
            document.createElement(
              "div"
            );

          opt.className =
            "combo-option";

          opt.innerText =
            name;

          opt.onmousedown =
            function(e){

              e.preventDefault();

              selectMedication(
                name
              );

            };

          box.appendChild(
            opt
          );

        }
      );
  }


  box.style.display =
    "block";

}

  document.getElementById(

function isEnglishMedicationName(
  value
){

  return /^[A-Za-z0-9][A-Za-z0-9\s\-_/().,+%]*$/.test(
    value
  );

}


/* =========================================================
   REGISTER
========================================================= */

async function submitMedication(){

  clearResult();


  if (
    !currentSessionToken
  ) {

    handleSessionExpired();

    return;
  }


  const name =
    document.getElementById(
      "medName"
    ).value.trim();


  const expiry =
    getExpiryDate();


  if (
    !name ||
    !expiry
  ) {

    showResult(
      "error",
      text[currentLang].missingFields
    );

    return;
  }


  if (
    !isEnglishMedicationName(
      name
    )
  ) {

    showResult(
      "error",
      text[currentLang].englishNameOnly
    );

    return;
  }


  try {

    const data =
      await postApi(
        "checkMedication",
        {
          name:name,
          medicationName:name
        },
        true
      );


    if (
      !data ||
      !data.success
    ) {

      if (
        isSessionError(
          data
        )
      ) {

        handleSessionExpired();

        return;
      }


      showResult(
        "error",
        text[currentLang].checkFailed +
        diagnosticText(
          data
        )
      );

      return;
    }


    const matches =
      data.matches ||
      data.items ||
      [];


    const older =
      matches.filter(
        function(m){

          const itemExpiry =
            m.expiry ||
            m.expiryDate ||
            "";

          return (
            itemExpiry &&
            itemExpiry <
              expiry
          );

        }
      );


    if (
      older.length
    ) {

      pendingMedication = {
        name:name,
        expiry:expiry
      };


      showConflict(
        older
      );

      return;
    }

  } catch(error){

    showResult(
      "error",
      text[currentLang].checkFailed +
      " [NETWORK_ERROR]"
    );

    return;
  }


  await saveMedication(
    name,
    expiry
  );

}

async function saveMedication(
  name,
  expiry
){

  try {

    const result =
      await postApi(
        "addMedication",
        {
          name:name,
          medicationName:name,

          expiry:expiry,
          expiryDate:expiry,

          registeredByUsername:
            currentEmployeeUsername,

          registeredByName:
            currentEmployeeName
        },
        true
      );


    if (
      !result.success
    ) {

      if (
        isSessionError(
          result
        )
      ) {

        handleSessionExpired();

        return;
      }


      showResult(
        "error",
        text[currentLang].saveFailed +
        diagnosticText(
          result
        )
      );

      return;
    }


    showResult(
      "success",
      text[currentLang].saved
    );


    document.getElementById(
      "medName"
    ).value =
      "";


    clearExpiryDate();


    pendingMedication =
      null;


    document.getElementById(
      "medName"
    ).focus();

  } catch(error){

    showResult(
      "error",
      text[currentLang].saveFailed +
      " [NETWORK_ERROR: " +
      String(
        error.message ||
        error
      ) +
      "]"
    );

  }

}


/* =========================================================
   API
========================================================= */

async function postApi(
  action,
  payload = {},
  includeSession = true
){

  const requestData = {
    action:action,
    ...payload
  };


  if (
    includeSession
  ) {

    currentSessionToken =
      localStorage.getItem(
        KIDNEY_SESSION_TOKEN_KEY
      ) ||
      currentSessionToken;


    if (
      currentSessionToken
    ) {

      requestData.sessionToken =
        currentSessionToken;

      requestData.token =
        currentSessionToken;

    }

  }


  const response =
    await fetch(
      KIDNEY_API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            requestData
          )
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "HTTP_" +
      response.status
    );

  }


  return await response.json();

}


/* =========================================================
   ERRORS
========================================================= */

function diagnosticText(
  result
){

  if (
    !result
  ) {
    return " [NO_RESPONSE]";
  }


  const parts =
    [];


  if (
    result.code
  ) {

    parts.push(
      "CODE=" +
      result.code
    );

  }


  if (
    result.message
  ) {

    parts.push(
      "MESSAGE=" +
      result.message
    );

  }


  if (
    !parts.length
  ) {

    parts.push(
      "UNKNOWN_ERROR"
    );

  }


  return (
    " [" +
    parts.join(
      " | "
    ) +
    "]"
  );

}


function isSessionError(
  result
){

  if (
    !result
  ) {
    return false;
  }


  return [
    "INVALID_SESSION",
    "MISSING_SESSION",
    "NO_PERMISSION",
    "USER_INACTIVE",
    "SESSION_REQUIRED"
  ].includes(
    result.code
  );

}

document.getElementById(
  "medName"
).addEventListener(
  "input",
  function(){

    renderMedOptions(
      this.value
    );

  }
);


document.getElementById(
  "medName"
).addEventListener(
  "focus",
  function(){

    renderMedOptions(
      this.value
    );

  }
);


document.addEventListener(
  "click",
  function(e){

    if (
      !e.target.closest(
        ".combo-wrap"
      )
    ) {

      document.getElementById(
        "medNameOptions"
      ).style.display =
        "none";

    }

  }
);


/* =========================================================
   START
========================================================= */

async function init(){

  buildExpirySelectors();

  setLanguage(
    "en"
  );

  await restoreSession();

}


document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>
