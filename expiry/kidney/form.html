<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Inspection</title>

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#168fb3}
.container{max-width:640px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1);min-height:calc(100vh - 32px)}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;direction:ltr}
.logo{width:120px;height:120px;object-fit:contain}
.official-header{width:fit-content;max-width:100%;text-align:right;transform:translateY(14px);padding-left:8px;border-left:4px solid #168fb3;direction:rtl}
.official-header h2,.official-header h3{margin:2px 0;font-size:13px;line-height:1.4;color:#168fb3}
hr{border:none;border-top:1px solid #e5e7eb;margin:14px 0}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;direction:ltr}
.date-box{color:#168fb3;padding:4px 0;font-size:13px;font-weight:bold;text-align:center}
.language-chip{color:#168fb3;font-size:13px;font-weight:bold;padding:4px 0;white-space:nowrap;background:transparent;border:0;cursor:pointer;font-family:inherit}
.title-row{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px auto 22px;flex-wrap:wrap}
.page-title{text-align:center;font-size:23px;font-weight:bold;margin:0;color:#168fb3}
label{font-weight:bold;display:block;margin-bottom:2px;color:#111827;font-size:12px}
input,select{width:100%;height:34px;padding:6px 9px;margin-top:4px;margin-bottom:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;background:#fff;text-align:start;font-family:inherit}
#medName{direction:ltr;text-align:left}
.primary-btn{padding:9px 18px;background:#168fb3;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;font-family:inherit}
.primary-btn:hover{filter:brightness(1.05)}
.primary-btn:disabled{background:#94a3b8;cursor:not-allowed}
.secondary-btn{border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-size:13px;font-weight:bold;color:#168fb3;padding:7px 10px;border-radius:8px;font-family:inherit}
.secondary-btn:hover{background:#f9fafb}
.login-card{max-width:280px;margin:16px auto 0;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:16px}
.login-actions{display:flex;align-items:center;justify-content:center;gap:8px;width:fit-content;margin:4px auto 0}
.login-actions .primary-btn,.login-actions .secondary-btn{width:40px;height:40px;margin:0;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1}
.login-svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.change-password-panel{display:none;border-top:1px solid #e5e7eb;margin-top:14px;padding-top:14px}
.employee-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:10px 14px;margin-bottom:12px}
.employee-name{font-weight:bold;color:#168fb3;font-size:14px}
.logout-icon{width:30px;height:30px;padding:0;border:none;background:transparent;color:#168fb3;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.logout-icon:hover{transform:scale(1.08)}
.power-svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.form-panel{width:min(100%,360px);margin:0 auto;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;padding:16px}
.combo-wrap{position:relative;width:100%;margin:0 auto}
.combo-options{position:absolute;top:100%;right:0;left:0;background:#fff;border:1px solid #cbd5e1;border-radius:8px;margin-top:-6px;max-height:190px;overflow-y:auto;box-shadow:0 10px 20px rgba(0,0,0,.1);z-index:20;display:none}
.combo-option{padding:8px 10px;font-size:13px;cursor:pointer;text-align:left;direction:ltr}
.combo-option:hover,.combo-option.active{background:#e0f2fe}
.combo-empty{padding:9px 12px;font-size:12px;color:#94a3b8}
.form-actions{display:flex;justify-content:center;margin-top:4px}
.conflict-box{display:none;background:#fff6e0;border:1px solid #eab308;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#7c5a00}
.conflict-box ul{margin:8px 0;padding-inline-start:18px}
.conflict-actions{display:flex;gap:10px;justify-content:center;margin-top:10px}
.conflict-actions button{min-width:120px}
.conflict-actions .danger-btn{background:#eab308;color:#111827;border:none;border-radius:8px;padding:8px 14px;font-weight:bold;font-size:13px;cursor:pointer;font-family:inherit}
#result,#loginResult{display:none;margin-top:12px;padding:10px;border-radius:8px;text-align:center;font-size:13px}
#result.error,#loginResult.error{display:block;background:#fef2f2;color:#991b1b}
#result.success,#loginResult.success{display:block;background:#ecfdf5;color:#065f46}

@media (max-width:700px){
  body{padding:10px;background:#fff}
  .container{padding:14px;border-radius:0;box-shadow:none;min-height:100vh}
  .logo{width:84px;height:84px}
  .official-header{transform:translateY(10px)}
  .official-header h2,.official-header h3{font-size:12px}
  .title-row{gap:8px;margin-bottom:20px}
  .page-title{font-size:20px}
  .form-panel{width:min(100%,320px);padding:14px}
  .login-actions .primary-btn,.login-actions .secondary-btn{width:44px!important;height:44px!important}
}

/*

function migrateOldSession(){

  const oldToken =
    sessionStorage.getItem(
      KIDNEY_SESSION_TOKEN_KEY
    );

  const oldName =
    sessionStorage.getItem(
      KIDNEY_SESSION_NAME_KEY
    );

  const oldUsername =
    sessionStorage.getItem(
      KIDNEY_SESSION_USERNAME_KEY
    );


  if (
    oldToken &&
    !localStorage.getItem(
      KIDNEY_SESSION_TOKEN_KEY
    )
  ) {
    localStorage.setItem(
      KIDNEY_SESSION_TOKEN_KEY,
      oldToken
    );
  }


  if (
    oldName &&
    !localStorage.getItem(
      KIDNEY_SESSION_NAME_KEY
    )
  ) {
    localStorage.setItem(
      KIDNEY_SESSION_NAME_KEY,
      oldName
    );
  }


  if (
    oldUsername &&
    !localStorage.getItem(
      KIDNEY_SESSION_USERNAME_KEY
    )
  ) {
    localStorage.setItem(
      KIDNEY_SESSION_USERNAME_KEY,
      oldUsername
    );
  }

}

function setLanguage(lang){

  currentLang =
    lang;

  document.documentElement.lang =
    lang;

  document.documentElement.dir =
    lang === "ar"
      ? "rtl"
      : "ltr";

  document.title =
    text[lang].title;

  document.getElementById("officialLine1").innerText =
    text[lang].officialLine1;

  document.getElementById("officialLine2").innerText =
    text[lang].officialLine2;

  document.getElementById("officialLine3").innerText =
    text[lang].officialLine3;

  document.getElementById("pageTitle").innerText =
    text[lang].title;

  document.getElementById("usernameLabel").innerText =
    text[lang].username;

  document.getElementById("passwordLabel").innerText =
    text[lang].password;

  document.getElementById("loginBtn").title =
    text[lang].login;

  document.getElementById("togglePasswordBtn").title =
    text[lang].changePassword;

  document.getElementById("changeUsernameLabel").innerText =
    text[lang].username;

  document.getElementById("oldPasswordLabel").innerText =
    text[lang].oldPassword;

  document.getElementById("newPasswordLabel").innerText =
    text[lang].newPassword;

  document.getElementById("changePasswordBtn").innerText =
    text[lang].changePassword;

  document.getElementById("logoutBtn").title =
    text[lang].logout;

  document.getElementById("medNameLabel").innerText =
    text[lang].medName;

  document.getElementById("medExpiryLabel").innerText =
    text[lang].medExpiry;

  document.getElementById("submitBtn").innerText =
    text[lang].submit;

  document.getElementById("confirmSaveBtn").innerText =
    text[lang].confirmSave;

  document.getElementById("cancelConflictBtn").innerText =
    text[lang].cancel;

  document.getElementById("conflictText").innerText =
    text[lang].conflictTitle;

  document.getElementById("languageToggle").innerText =
    "🌐 ع | E";

  if (
    currentEmployeeName
  ) {
    document.getElementById("employeeName").innerText =
      currentEmployeeName;
  }

  renderDate();
}


function toggleLanguage(){

  setLanguage(
    currentLang === "ar"
      ? "en"
      : "ar"
  );
}


function renderDate(){

  const now =
    new Date();

  const date =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Riyadh"
      }
    ).format(now);

  const dayName =
    new Intl.DateTimeFormat(
      currentLang === "ar"
        ? "ar-SA"
        : "en-US",
      {
        timeZone:"Asia/Riyadh",
        weekday:"long"
      }
    ).format(now);

  document.getElementById("dateBox").innerText =
    `${dayName} - ${date}`;
}

  );

  sessionStorage.setItem(
    KIDNEY_SESSION_TOKEN_KEY,
    currentSessionToken
  );

}


function clearStoredSession(){

  localStorage.removeItem(
    KIDNEY_SESSION_NAME_KEY
  );

  localStorage.removeItem(
    KIDNEY_SESSION_USERNAME_KEY
  );

  localStorage.removeItem(
    KIDNEY_SESSION_TOKEN_KEY
  );


  sessionStorage.removeItem(
    KIDNEY_SESSION_NAME_KEY
  );

  sessionStorage.removeItem(
    KIDNEY_SESSION_USERNAME_KEY
  );

  sessionStorage.removeItem(
    KIDNEY_SESSION_TOKEN_KEY
  );


  currentEmployeeName =
    "";

  currentEmployeeUsername =
    "";

  currentSessionToken =
    "";

}


/* =========================================================
   LOGIN
========================================================= */

async function loginEmployee(){

  const username =
    document.getElementById(
      "username"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value.trim();


  try {

    const result =
      await postApi(
        "employeeLogin",
        {
          username,
          password
        },
        false
      );


    if (
      !result.success ||
      !result.employee ||
      !result.sessionToken
    ) {

      showLoginResult(
        "error",
        text[currentLang].invalidLogin +
        diagnosticText(
          result
        )
      );

      return;
    }


    currentEmployeeName =
      result.employee.name ||
      result.employee.username ||
      username;


    currentEmployeeUsername =
      result.employee.username ||
      username;


    currentSessionToken =
      result.sessionToken;


    saveStoredSession();

    clearLoginResult();

    showEmployeeView();

  } catch(error){

    showLoginResult(
      "error",
      text[currentLang].invalidLogin +
      " [NETWORK_ERROR]"
    );

  }
}


/* =========================================================
   RESTORE SESSION
========================================================= */

async function restoreSession(){

  currentSessionToken =
    localStorage.getItem(
      KIDNEY_SESSION_TOKEN_KEY
    ) || "";


  currentEmployeeName =
    localStorage.getItem(
      KIDNEY_SESSION_NAME_KEY
    ) || "";


  currentEmployeeUsername =
    localStorage.getItem(
      KIDNEY_SESSION_USERNAME_KEY
    ) || "";


  if (
    !currentSessionToken
  ) {

    clearStoredSession();

    showLoginView();

    return;
  }


  try {

    const result =
      await postApi(
        "validateSession",
        {},
        true
      );


    if (
      !result.success ||
      !result.user
    ) {

      clearStoredSession();

      showLoginView();

      return;
    }


    currentEmployeeUsername =
      result.user.username ||
      currentEmployeeUsername;


    currentEmployeeName =
      result.user.name ||
      result.user.username ||
      currentEmployeeName;


    saveStoredSession();

    showEmployeeView();

  } catch(error){

    clearStoredSession();

    showLoginView();

  }
}


/* =========================================================
   CHANGE PIN
========================================================= */

  const panel =
    document.getElementById(
      "changePasswordPanel"
    );

  panel.style.display =
    panel.style.display === "block"
      ? "none"

}


async function changePassword(){

  const username =
    document.getElementById(
      "changeUsername"
    ).value.trim();

  const oldPassword =
    document.getElementById(
      "oldPassword"
    ).value.trim();

  const newPassword =
    document.getElementById(
      "newPassword"
    ).value.trim();


  if (
    !newPassword
  ) {

    showLoginResult(
      "error",
      text[currentLang].passwordTooShort
    );

    return;
  }


  try {

    const result =
      await postApi(
        "changeEmployeePassword",
        {
          username,
          oldPassword,
          newPassword
        },
        false
      );


    if (
      !result.success
    ) {

      showLoginResult(
        "error",
        text[currentLang].passwordMismatch +
        diagnosticText(

        )
      );

      return;
    }


    document.getElementById(
      "oldPassword"
    ).value =
      "";


    document.getElementById(
      "newPassword"
    ).value =
      "";


    clearStoredSession();


    showLoginResult(
      "success",
      text[currentLang].passwordChanged
    );

  } catch(error){

    showLoginResult(
      "error",
      text[currentLang].passwordMismatch +
      " [NETWORK_ERROR]"
    );

  }
}


/* =========================================================
   LOGOUT
========================================================= */

function logoutEmployee(){

  clearStoredSession();

  window.clearTimeout(
    inactivityTimer
  );

  pendingMedication =
    null;

  document.getElementById(
    "conflictBox"
  ).style.display =
    "none";

  showLoginView();
}


function showLoginView(){

  document.getElementById(
    "employeeView"
  ).style.display =
    "none";

  document.getElementById(
    "loginView"
  ).style.display =
    "block";
}


function showEmployeeView(){

  document.getElementById(
    "loginView"
  ).style.display =
    "none";

  document.getElementById(
    "employeeView"
  ).style.display =
    "block";

  document.getElementById(
    "employeeName"
  ).innerText =
    currentEmployeeName;

  startInactivityWatcher();
}


/* =========================================================
   INACTIVITY
========================================================= */

function startInactivityWatcher(){

  if (
    !inactivityWatcherStarted
  ) {

    [
      "click",
      "keydown",
      "touchstart",
      "mousemove"
    ].forEach(
      function(eventName){

        window.addEventListener(
          eventName,
          resetInactivityTimer,
          {
            passive:true
          }
        );

      }
    );

    inactivityWatcherStarted =
      true;
  }

  resetInactivityTimer();
}


function resetInactivityTimer(){

  window.clearTimeout(
    inactivityTimer
  );

  inactivityTimer =
    window.setTimeout(
      function(){

        if (
          currentSessionToken
        ) {
          logoutEmployee();
        }

      },
      INACTIVITY_LIMIT_MS
    );

}


/* =========================================================
   MEDICATION COMBO
========================================================= */

function renderMedOptions(
  filterText
){

  const box =
    document.getElementById(
      "medNameOptions"
    );


  const q =
    (
      filterText ||
      ""
    )
      .trim()
      .toLowerCase();


  const matches =
    q
      ? MEDICATIONS.filter(
          function(m){
            return m
              .toLowerCase()
              .includes(
                q
              );
          }
        )
      : MEDICATIONS;


  box.innerHTML =
    "";


  if (
    !matches.length
  ) {

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "combo-empty";

    empty.innerText =
      text[currentLang].noMatches;

    box.appendChild(
      empty
    );

  } else {

    matches
      .slice(
        0,
        50
      )
      .forEach(
        function(name){

          const opt =
            document.createElement(
              "div"
            );

          opt.className =
            "combo-option";

          opt.innerText =
            name;

          opt.onmousedown =
            function(e){

              e.preventDefault();

              selectMedication(
                name
              );

            };

          box.appendChild(
            opt
          );

        }
      );
  }


  box.style.display =
    "block";

}


function selectMedication(
  name
){

  document.getElementById(
    "medName"
  ).value =
    name;

  document.getElementById(
    "medNameOptions"
  ).style.display =
    "none";

}


function isEnglishMedicationName(
  value
){

  return /^[A-Za-z0-9][A-Za-z0-9\s\-_/().,+%]*$/.test(
    value
  );

}


/* =========================================================
   REGISTER
========================================================= */

async function submitMedication(){

  clearResult();


  if (
    !currentSessionToken
  ) {

    handleSessionExpired();

    return;
  }


  const name =
    document.getElementById(
      "medName"
    ).value.trim();


  const expiry =
    document.getElementById(
      "medExpiry"
    ).value;


  if (
    !name ||
    !expiry
  ) {

    showResult(
      "error",
      text[currentLang].missingFields
    );

    return;
  }


  if (
    !isEnglishMedicationName(
      name
    )
  ) {

    showResult(
      "error",
      text[currentLang].englishNameOnly
    );

    return;
  }


  /*
    checkMedication أصبح الآن POST محمي.
  */
  try {

    const data =
      await postApi(
        "checkMedication",
        {
          name
        },
        true
      );


    if (
      !data ||
      !data.success
    ) {

      if (
        isSessionError(
          data
        )
      ) {

        handleSessionExpired();

        return;
      }


      showResult(
        "error",
        text[currentLang].checkFailed +
        diagnosticText(
          data
        )
      );

      return;
    }


    const matches =
      data.matches ||
      [];


    const older =
      matches.filter(
        function(m){

          return (
            m.expiry &&
            m.expiry <
              expiry
          );

        }
      );


    if (
      older.length
    ) {

      pendingMedication = {
        name,
        expiry
      };


      showConflict(
        older
      );

      return;
    }

  } catch(error){

    showResult(
      "error",
      text[currentLang].checkFailed +
      " [NETWORK_ERROR]"
    );

    return;
  }


  await saveMedication(
    name,
    expiry
  );

}


/* =========================================================
   CONFLICT
========================================================= */

function showConflict(
  older
){

  const list =
    document.getElementById(
      "conflictList"
    );

  list.innerHTML =
    "";


  older.forEach(
    function(m){

      const li =
        document.createElement(
          "li"
        );

      li.innerText =
        m.expiry +
        (
          m.registeredBy
            ? " — " +
              m.registeredBy
            : ""
        );

      list.appendChild(
        li
      );

    }
  );


  document.getElementById(
    "conflictBox"
  ).style.display =
    "block";

}


function cancelConflict(){

  pendingMedication =
    null;

  document.getElementById(
    "conflictBox"
  ).style.display =
    "none";

}


async function confirmSave(){

  if (
    !pendingMedication
  ) {
    return;
  }


  const {
    name,
    expiry
  } =
    pendingMedication;


  document.getElementById(
    "conflictBox"
  ).style.display =
    "none";


  await saveMedication(
    name,
    expiry
  );

}


/* =========================================================
   SAVE
========================================================= */

async function saveMedication(
  name,
  expiry
){

  try {

    const result =
      await postApi(
        "addMedication",
        {
          name,
          expiry
        },
        true
      );


    if (
      !result.success
    ) {

      if (
        isSessionError(
          result
        )
      ) {

        handleSessionExpired();

        return;
      }


      showResult(
        "error",
        text[currentLang].saveFailed +
        diagnosticText(
          result
        )
      );

      return;
    }


    showResult(
      "success",
      text[currentLang].saved
    );


    document.getElementById(
      "medName"
    ).value =
      "";


    document.getElementById(
      "medExpiry"
    ).value =
      "";


    pendingMedication =
      null;

  } catch(error){

    showResult(
      "error",
      text[currentLang].saveFailed +
      " [NETWORK_ERROR: " +
      String(
        error.message ||
        error
      ) +
      "]"
    );

  }

}


/* =========================================================
   API
========================================================= */

async function postApi(
  action,
  payload = {},
  includeSession = true
){

  const requestData = {
    action,
    ...payload
  };


  if (
    includeSession
  ) {

    currentSessionToken =
      localStorage.getItem(
        KIDNEY_SESSION_TOKEN_KEY
      ) ||
      currentSessionToken;


    if (
      currentSessionToken
    ) {

      requestData.sessionToken =
        currentSessionToken;

    }

  }


  const response =
    await fetch(
      KIDNEY_API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            requestData
          )
      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "HTTP_" +
      response.status
    );

  }


  return await response.json();

}


/* =========================================================
   ERRORS
========================================================= */

function diagnosticText(
  result
){

  if (
    !result
  ) {
    return " [NO_RESPONSE]";
  }


  const parts =
    [];


  if (
    result.code
  ) {

    parts.push(
      "CODE=" +
      result.code
    );

  }


  if (
    result.message
  ) {

    parts.push(
      "MESSAGE=" +
      result.message
    );

  }


  if (
    !parts.length
  ) {

    parts.push(
      "UNKNOWN_ERROR"
    );

  }


  return (
    " [" +
    parts.join(
      " | "
    ) +
    "]"
  );

}


function isSessionError(
  result
){

  if (
    !result
  ) {
    return false;
  }


  return [
    "INVALID_SESSION",
    "MISSING_SESSION",
    "NO_PERMISSION",
    "USER_INACTIVE",
    "SESSION_REQUIRED"
  ].includes(
    result.code
  );

}


function handleSessionExpired(){

  clearStoredSession();

  pendingMedication =
    null;


  document.getElementById(
    "conflictBox"
  ).style.display =
    "none";


  showLoginView();


  showLoginResult(
    "error",
    text[currentLang].sessionExpired
  );

}
