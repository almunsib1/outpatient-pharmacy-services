<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#168fb3}
.container{max-width:1100px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.1)}
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;direction:rtl}
.logo{width:120px;height:120px;object-fit:contain}

.official-header{
  width:fit-content;
  max-width:100%;
  text-align:start;
  margin-inline-start:0;
  margin-inline-end:auto;
  transform:translateY(14px)
}

.official-header h2,
.official-header h3{
  margin:2px 0;
  font-size:13px;
  line-height:1.4;
  color:#168fb3
}

/* العربي كما هو */
[dir="rtl"] .official-header{
  padding-left:8px;
  border-left:4px solid #168fb3
}

/* الإنجليزي: نفس مكان الترويسة، فقط الخط والمحاذاة */
[dir="ltr"] .official-header{
  padding-left:6px;
  padding-right:0;
  border-left:4px solid #168fb3;
  border-right:0;
  text-align:left
}

[dir="ltr"] .official-header h2,
[dir="ltr"] .official-header h3{
  direction:ltr;
  text-align:left
}

hr{border:none;border-top:1px solid #e5e7eb;margin:14px 0}
.page-title{text-align:center;font-size:24px;font-weight:bold;margin:14px 0 10px;color:#168fb3}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;direction:ltr}
.date-box{color:#168fb3;padding:6px 10px;font-size:13px;font-weight:bold;text-align:center}
.language-btn{border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:bold;color:#168fb3;padding:4px 0;border-radius:0}
.secondary-btn,.action-btn{border:1px solid #cbd5e1;background:#fff;cursor:pointer;font-size:13px;font-weight:bold;color:#168fb3;padding:7px 10px;border-radius:8px}
.language-btn:hover{background:transparent}
.secondary-btn:hover{background:#f9fafb}
.login-card,.toolbar,.empty-box{border:1px solid #e5e7eb;background:#f9fafb;border-radius:8px;padding:14px;margin-top:14px}

.primary-btn:disabled,.action-btn:disabled{background:#94a3b8;color:#fff;cursor:not-allowed}
.toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toolbar > div{min-width:0}
.pharmacy-tools{flex:0 0 auto}
.pharmacy-tools select{width:auto;min-width:230px;height:38px;margin-bottom:0;font-size:14px}
.employee-name{font-weight:bold;color:#168fb3;font-size:24px;line-height:1.2}
.employee-tools{flex:1 1 100%;display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;min-height:42px;color:#168fb3}
.employee-line{display:flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.logout-icon{width:34px;height:34px;padding:0;border:none;background:transparent;color:#168fb3;font-size:0;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0}
.power-svg{width:30px;height:30px;display:block;fill:none;stroke:currentColor;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round}
.logout-icon:hover{background:transparent;transform:scale(1.06)}
.table-wrap{overflow-x:auto;margin-top:16px}

th,td{padding:8px;border:1px solid #e5e7eb;text-align:center;color:#111827;font-size:13px}
th{background:#168fb3;color:#fff}
.status{display:inline-block;padding:5px 9px;border-radius:8px;font-weight:bold;font-size:13px}
.status-booked{background:#eff6ff;color:#1d4ed8}
.status-received{background:#fff7ed;color:#9a3412}
.status-delivered{background:#ecfdf5;color:#047857}
.row-actions{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:nowrap}
.icon-btn{width:28px;height:28px;padding:0;border:none;background:transparent;border-radius:0;display:inline-flex;align-items:center;justify-content:center;font-size:20px;line-height:1}
.icon-btn:hover{background:transparent;transform:scale(1.08)}
.icon-btn:disabled{background:transparent;color:#9ca3af;border:none;cursor:not-allowed;filter:grayscale(1);opacity:.55;transform:none}
.print-btn{background:transparent;color:#168fb3;border:none}
.receive-btn{background:transparent;color:#168fb3;border:none}
.deliver-btn{background:transparent;color:#0f766e;border:none}
.deliver-btn.delivered-complete{background:transparent;color:#9ca3af;border:none}

#result{display:none;margin-top:14px;padding:12px;border-radius:8px;text-align:center}
#result.error{display:block;background:#fef2f2;color:#991b1b}
#result.success{display:block;background:#ecfdf5;color:#065f46}
#loginResult{display:none;margin-top:12px;padding:10px;border-radius:8px;text-align:center}
#loginResult.error{display:block;background:#fef2f2;color:#991b1b}
#loginResult.success{display:block;background:#ecfdf5;color:#065f46}

.toolbar{padding:12px}
.table-wrap{max-width:1000px;margin:14px auto 0}
table{min-width:820px}
th,td{padding:6px 5px;font-size:12px}
.status{padding:4px 7px;font-size:11px}
.row-actions{gap:7px}
.icon-btn{width:24px;height:24px;font-size:18px}
.print-label{display:none}

@media print{
body *{visibility:hidden}
.print-label,.print-label *{visibility:visible}
.print-label{display:block;position:absolute;left:0;top:0;width:58mm;padding:6mm;text-align:center;color:#000;font-family:Arial,sans-serif}
.print-label .print-booking{font-size:24px;font-weight:bold;margin-bottom:8px}
.print-label .print-name{font-size:16px;margin-bottom:8px}
.print-label .print-employee{font-size:13px}
}

@media (max-width:600px){
body{padding:10px;background:#fff}
.container{padding:14px;border-radius:0;box-shadow:none}
.logo{width:84px;height:84px}
.official-header{transform:translateY(10px)}
.official-header h2,.official-header h3{font-size:12px}
.page-title{font-size:20px}
.date-box,.language-btn{font-size:12px;padding:6px 9px}

.pharmacy-tools select{width:100%;min-width:0}

.login-actions .primary-btn,.login-actions .secondary-btn{width:42px!important;min-width:42px!important;height:42px!important;min-height:42px!important;margin:0!important;padding:0!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;font-size:20px;line-height:1}
.table-wrap{margin-top:12px}
table{min-width:720px}
th,td{padding:5px 4px;font-size:11px}
.status{font-size:10px;padding:3px 5px}
.icon-btn{width:22px;height:22px;font-size:17px}
}
</style>

const SESSION_TOKEN_KEY = "medSessionToken";
const SESSION_NAME_KEY = "medEmployeeName";
const SESSION_USERNAME_KEY = "medEmployeeUsername";

let currentLang = "ar";
let currentEmployee = "";
let currentUsername = "";
let currentSessionToken = "";

let bookings = [];
let refreshTimer = null;
let employeeInactivityTimer = null;
let inactivityWatcherStarted = false;

/*
يحفظ الحجوزات التي يتم تحديثها حالياً.
يمنع الضغط المتكرر على نفس الحجز.

  },

  en: {

    pageTitle:"Monthly Medication Appointment Management",
    username:"Username",
    password:"PIN",

    passwordTooShort:"New PIN cannot be empty.",

    invalidLogin:"Incorrect username/PIN or no permission.",
    pharmacyFilter:"Select Pharmacy",

    patient:"Patient Name",
    file:"File Number",

    pharmacy:"Pharmacy",

    actions:"Actions",

    deliver:"Mark Delivered",
    booked:"Booked",

    delivered:"Delivered",

};


/* =========================================================
   LANGUAGE
========================================================= */

function setLanguage(lang) {

  currentLang = lang;

  document.documentElement.lang =
    lang;

  document.documentElement.dir =
    lang === "ar"
      ? "rtl"
      : "ltr";

  document.getElementById("officialLine1").innerText =
    text[lang].officialLine1;

  document.getElementById("officialLine2").innerText =
    text[lang].officialLine2;

  document.getElementById("officialLine3").innerText =
    text[lang].officialLine3;

  document.getElementById("pageTitle").innerText =
    text[lang].pageTitle;

  document.getElementById("usernameLabel").innerText =
    text[lang].username;

  document.getElementById("passwordLabel").innerText =
    text[lang].password;

  document.getElementById("loginBtn").innerHTML =
    loginIcon();

  document.getElementById("loginBtn").title =
    text[lang].login;

  document.getElementById("togglePasswordBtn").innerText =
    "🔑";

  document.getElementById("togglePasswordBtn").title =
    text[lang].changePassword;

  document.getElementById("changeUsernameLabel").innerText =
    text[lang].username;

  document.getElementById("oldPasswordLabel").innerText =
    text[lang].oldPassword;

  document.getElementById("newPasswordLabel").innerText =
    text[lang].newPassword;

  document.getElementById("changePasswordBtn").innerText =
    text[lang].changePassword;

  document.getElementById("logoutBtn").innerHTML =
    powerIcon();

  document.getElementById("logoutBtn").title =
    text[lang].logout;

  document.getElementById("pharmacyFilterLabel").innerText =
    text[lang].pharmacyFilter;

  document.getElementById("bookingIdHeader").innerText =
    text[lang].bookingId;

  document.getElementById("patientHeader").innerText =
    text[lang].patient;

  document.getElementById("fileHeader").innerText =
    text[lang].file;

  document.getElementById("mobileHeader").innerText =
    text[lang].mobile;

  document.getElementById("pharmacyHeader").innerText =
    text[lang].pharmacy;

  document.getElementById("timeHeader").innerText =
    text[lang].pickupTime;

  document.getElementById("statusHeader").innerText =
    text[lang].status;

  document.getElementById("actionsHeader").innerText =
    text[lang].actions;

  document.getElementById("languageToggle").innerText =
    "🌐 ع | E";

  renderDate();

  renderPharmacyFilter();

  renderBookings();
}


function toggleLanguage() {

  setLanguage(
    currentLang === "ar"
      ? "en"
      : "ar"
  );

}


function loginIcon() {

  return '<svg class="login-svg" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path><path d="M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"></path></svg>';

}


function powerIcon() {

  return '<svg class="power-svg" viewBox="0 0 24 24"><path d="M12 3v9"></path><path d="M7.1 6.8a8 8 0 1 0 9.8 0"></path></svg>';

}


/* =========================================================
   DATE
========================================================= */

function renderDate() {

  const now =
    new Date();

  const date =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:
          "Asia/Riyadh"
      }
    ).format(
      now
    );

  const dayName =
    new Intl.DateTimeFormat(
      currentLang === "ar"
        ? "ar-SA"
        : "en-US",
      {
        timeZone:
          "Asia/Riyadh",
        weekday:
          "long"
      }
    ).format(
      now
    );

  document.getElementById("dateBox").innerText =
    `${dayName} - ${date}`;

}


/* =========================================================
   PHARMACY FILTER
========================================================= */

function renderPharmacyFilter() {

  const select =
    document.getElementById(
      "pharmacyFilter"
    );

  const selected =
    select.value;

  select.innerHTML =
    "";

  PHARMACIES.forEach(
    function(pharmacy) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        pharmacy.value;

      option.textContent =
        pharmacy[currentLang];

      select.appendChild(
        option
      );

    }
  );

  select.value =
    selected ||
    "";

}


/* =========================================================
   SESSION
========================================================= */

function saveSession() {

  localStorage.setItem(
    SESSION_TOKEN_KEY,
    currentSessionToken
  );

  localStorage.setItem(
    SESSION_NAME_KEY,
    currentEmployee
  );

  localStorage.setItem(
    SESSION_USERNAME_KEY,
    currentUsername
  );

}


function clearStoredSession() {

  localStorage.removeItem(
    SESSION_TOKEN_KEY
  );

  localStorage.removeItem(
    SESSION_NAME_KEY
  );

  localStorage.removeItem(
    SESSION_USERNAME_KEY
  );

  currentEmployee = "";
  currentUsername = "";
  currentSessionToken = "";

}


/* =========================================================
   API
========================================================= */

async function postApi(
  action,
  payload = {},
  includeSession = true
) {

  const requestData = {
    action,
    ...payload
  };

  if (includeSession) {

    currentSessionToken =
      localStorage.getItem(
        SESSION_TOKEN_KEY
      ) ||
      currentSessionToken;

    if (
      currentSessionToken
    ) {

      requestData.sessionToken =
        currentSessionToken;

    }

  }

  const response =
    await fetch(
      API_BASE_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body:
          JSON.stringify(
            requestData
          )
      }
    );

  if (
    !response.ok
  ) {

    throw new Error(
      "HTTP_" +
      response.status
    );

  }

  return await response.json();

}


/* =========================================================
   LOGIN
========================================================= */

async function loginEmployee() {

  const username =
    document.getElementById(
      "username"
    ).value.trim();

  const password =
    document.getElementById(
      "password"
    ).value.trim();

  try {

    const result =
      await postApi(
        "employeeLogin",
        {
          username,
          password
        },
        false
      );

    if (
      !result.success ||
      !result.employee ||
      !result.sessionToken
    ) {

      showLoginResult(
        "error",
        text[currentLang].invalidLogin
      );

      return;

    }

    currentEmployee =
      result.employee.name ||
      result.employee.username ||
      username;

    currentUsername =
      result.employee.username ||
      username;

    currentSessionToken =
      result.sessionToken;

    saveSession();

    clearLoginResult();

    showEmployeeView();

  } catch(error) {

    showLoginResult(
      "error",
      text[currentLang].invalidLogin
    );

  }

}


/* =========================================================
   RESTORE SESSION
========================================================= */

async function restoreSession() {

  currentSessionToken =
    localStorage.getItem(
      SESSION_TOKEN_KEY
    ) || "";

  currentEmployee =
    localStorage.getItem(
      SESSION_NAME_KEY
    ) || "";

  currentUsername =
    localStorage.getItem(
      SESSION_USERNAME_KEY
    ) || "";

  if (
    !currentSessionToken
  ) {

    showLoginView();

    return;

  }

  try {

    const result =
      await postApi(
        "validateSession",
        {
          service:"med"
        },
        true
      );

    if (
      !result.success ||
      !result.user
    ) {

      clearStoredSession();

      showLoginView();

      return;

    }

    currentUsername =
      result.user.username ||
      currentUsername;

    currentEmployee =
      result.user.name ||
      result.user.username ||
      currentEmployee;

    saveSession();

    showEmployeeView();

  } catch(error) {

    clearStoredSession();

    showLoginView();

  }

}


/* =========================================================
   CHANGE PIN
========================================================= */

function togglePasswordPanel() {

  const panel =
    document.getElementById(
      "changePasswordPanel"
    );

  panel.style.display =
    panel.style.display === "block"
      ? "none"
      : "block";

  clearLoginResult();

}


async function changePassword() {

  const username =
    document.getElementById(
      "changeUsername"
    ).value.trim();

  const oldPassword =
    document.getElementById(
      "oldPassword"
    ).value.trim();

  const newPassword =
    document.getElementById(
      "newPassword"
    ).value.trim();

  if (!newPassword) {

    showLoginResult(
      "error",
      text[currentLang].passwordTooShort
    );

    return;

  }

  try {

    const result =
      await postApi(
        "changeEmployeePassword",
        {
          username,
          oldPassword,
          newPassword
        },
        false
      );

    if (!result.success) {

      showLoginResult(
        "error",
        text[currentLang].passwordMismatch
      );

      return;

    }

    document.getElementById(
      "oldPassword"
    ).value = "";

    document.getElementById(
      "newPassword"
    ).value = "";

    clearStoredSession();

    showLoginResult(
      "success",
      text[currentLang].passwordChanged
    );

    showLoginView();

  } catch(error) {

    showLoginResult(
      "error",
      text[currentLang].passwordMismatch
    );

  }

}


/* =========================================================
   LOGOUT
========================================================= */

async function logoutEmployee() {

  if (
    currentSessionToken
  ) {

    try {

      await postApi(
        "revokeSession",
        {},
        true
      );

    } catch(error) {}

  }

  clearStoredSession();

  stopAutoRefresh();

  stopEmployeeInactivityWatcher();

  bookings = [];

  renderBookings();

  showLoginView();

}


/* =========================================================
   VIEWS
========================================================= */

function showLoginView() {

  document.getElementById(
    "employeeView"
  ).style.display =
    "none";

  document.getElementById(
    "loginView"
  ).style.display =
    "block";

}


function showEmployeeView() {

  document.getElementById(
    "loginView"
  ).style.display =
    "none";

  document.getElementById(
    "employeeView"
  ).style.display =
    "block";

  document.getElementById(
    "employeeName"
  ).innerText =
    currentEmployee;

  loadBookings();

  startAutoRefresh();

  startEmployeeInactivityWatcher();

}


/* =========================================================
   INACTIVITY
========================================================= */

function startEmployeeInactivityWatcher() {

  if (
    !inactivityWatcherStarted
  ) {

    [
      "click",
      "keydown",
      "touchstart",
      "mousemove"
    ].forEach(
      function(eventName) {

        window.addEventListener(
          eventName,
          resetEmployeeInactivityTimer,
          {
            passive:true
          }
        );

      }
    );

    inactivityWatcherStarted =
      true;

  }

  resetEmployeeInactivityTimer();

}


function stopEmployeeInactivityWatcher() {

  window.clearTimeout(
    employeeInactivityTimer
  );

}


function resetEmployeeInactivityTimer() {

  window.clearTimeout(
    employeeInactivityTimer
  );

  employeeInactivityTimer =
    window.setTimeout(
      function() {

        if (
          localStorage.getItem(
            SESSION_TOKEN_KEY
          )
        ) {

          logoutEmployee();

        }

      },
      EMPLOYEE_INACTIVITY_LIMIT_MS
    );

}


/* =========================================================
   AUTO REFRESH
========================================================= */

function startAutoRefresh() {

  stopAutoRefresh();

  refreshTimer =
    setInterval(
      function() {

        if (
          currentSessionToken &&
          pendingBookings.size === 0
        ) {

          loadBookings(
            true
          );

        }

      },
      10000
    );

}


function stopAutoRefresh() {

  if (
    refreshTimer
  ) {

    clearInterval(
      refreshTimer
    );

    refreshTimer =
      null;

  }

}


/* =========================================================
   RESULTS
========================================================= */

function showResult(
  type,
  message
) {

  const result =
    document.getElementById(
      "result"
    );

  result.className =
    type;

  result.innerText =
    message;

}


function showLoginResult(
  type,
  message
) {

  const result =
    document.getElementById(
      "loginResult"
    );

  result.className =
    type;

  result.innerText =
    message;

}


function clearLoginResult() {

  const result =
    document.getElementById(
      "loginResult"
    );

  result.className = "";
  result.innerText = "";

}


function clearResult() {

  const result =
    document.getElementById(
      "result"
    );

  result.className = "";
  result.innerText = "";

}


/* =========================================================
   SESSION ERROR
========================================================= */

function isSessionError(
  data
) {

  return Boolean(
    data &&
    [
      "INVALID_SESSION",
      "MISSING_SESSION",
      "NO_PERMISSION",
      "USER_INACTIVE",
      "UNAUTHORIZED"
    ].includes(
      data.code
    )
  );

}


function handleSessionExpired() {

  clearStoredSession();

  stopAutoRefresh();

  stopEmployeeInactivityWatcher();

  bookings = [];

  showLoginView();

  showLoginResult(
    "error",
    text[currentLang].sessionExpired
  );

}


/* =========================================================
   LOAD BOOKINGS
========================================================= */

async function loadBookings(
  isSilent
) {

  if (
    !currentSessionToken
  ) {

    return;

  }

  if (
    pendingBookings.size > 0
  ) {

    return;

  }

  if (!isSilent) {

    document.getElementById(
      "emptyBox"
    ).style.display =
      "block";

    document.getElementById(
      "emptyBox"
    ).innerText =
      text[currentLang].loading;

    document.getElementById(
      "bookingsTable"
    ).style.display =
      "none";

  }

  const pharmacy =
    document.getElementById(
      "pharmacyFilter"
    ).value;

  try {

    const data =
      await postApi(
        "employeeBookings",
        {
          pharmacy
        },
        true
      );

    if (
      !data ||
      !data.success
    ) {

      if (
        isSessionError(
          data
        )
      ) {

        handleSessionExpired();

        return;

      }

      return;

    }

    bookings =
      data.bookings ||
      [];

    renderBookings();

  } catch(error) {

    if (!isSilent) {

      showResult(
        "error",
        text[currentLang].updateFailed
      );

    }

  }

}


/* =========================================================
   RENDER BOOKINGS
========================================================= */

function renderBookings() {

  const body =
    document.getElementById(
      "bookingsBody"
    );

  const table =
    document.getElementById(
      "bookingsTable"
    );

  const empty =
    document.getElementById(
      "emptyBox"
    );

  body.innerHTML = "";

  if (!bookings.length) {

    table.style.display =
      "none";

    empty.style.display =
      "block";

    empty.innerText =
      text[currentLang].noBookings;

    return;

  }

  empty.style.display =
    "none";

  table.style.display =
    "table";

  bookings.forEach(
    function(booking) {

      const status =
        normalizeClientStatus(
          booking.status
        );

      const isPending =
        pendingBookings.has(
          booking.bookingId
        );

      const receiveDisabled =
        isPending ||
        status === "Received" ||
        status === "Delivered";

      const deliverDisabled =
        isPending ||
        status === "Delivered";

      const deliverClass =
        status === "Delivered"
          ? " delivered-complete"
          : "";

      const tr =
        document.createElement(
          "tr"
        );

      tr.innerHTML = `
        <td>${escapeHtml(booking.bookingId)}</td>
        <td>${escapeHtml(booking.fullName)}</td>
        <td>${escapeHtml(booking.fileNumber)}</td>
        <td>${escapeHtml(booking.mobileNumber || "")}</td>
        <td>${escapeHtml(getPharmacyName(booking.pharmacy))}</td>
        <td>${escapeHtml(booking.pickupTime)}</td>
        <td>${statusBadge(status)}</td>

        <td>
          <div class="row-actions">

            <button
              type="button"
              class="action-btn icon-btn print-btn"
              title="${escapeHtml(text[currentLang].print)}"
              onclick="printLabel('${escapeJs(booking.bookingId)}')">
              🖨️
            </button>

            <button
              type="button"
              class="action-btn icon-btn receive-btn"
              title="${escapeHtml(text[currentLang].receive)}"
              ${receiveDisabled ? "disabled" : ""}
              onclick="updateStatus('${escapeJs(booking.bookingId)}','markReceived')">
              📦
            </button>

            <button
              type="button"
              class="action-btn icon-btn deliver-btn${deliverClass}"
              title="${escapeHtml(text[currentLang].deliver)}"
              ${deliverDisabled ? "disabled" : ""}
              onclick="updateStatus('${escapeJs(booking.bookingId)}','markDelivered')">
              ✅
            </button>

          </div>
        </td>
      `;

      body.appendChild(
        tr
      );

    }
  );

}


/* =========================================================
   STATUS
========================================================= */

function normalizeClientStatus(
  status
) {

  if (
    !status ||
    status === "Confirmed"
  ) {

    return "Booked";

  }

  return status;

}


function statusBadge(
  status
) {

  const normalized =
    status ||
    "Booked";

  const labelMap = {

    Booked:
      text[currentLang].booked,

    Received:
      text[currentLang].received,

    Delivered:
      text[currentLang].delivered

  };

  const classMap = {

    Booked:
      "status-booked",

    Received:
      "status-received",

    Delivered:
      "status-delivered"

  };

  return (
    '<span class="status ' +
    (
      classMap[normalized] ||
      "status-booked"
    ) +
    '">' +
    escapeHtml(
      labelMap[normalized] ||
      normalized
    ) +
    "</span>"
  );

}


/* =========================================================
   PHARMACY NAME
========================================================= */

function getPharmacyName(
  value
) {

  const pharmacy =
    PHARMACIES.find(
      function(item) {

        return (
          item.value ===
          value
        );

      }
    );

  return pharmacy
    ? pharmacy[currentLang]
    : value;

}


/* =========================================================
   PRINT
========================================================= */

function printLabel(
  bookingId
) {

  const booking =
    bookings.find(
      function(item) {

        return (
          item.bookingId ===
          bookingId
        );

      }
    );

  if (!booking) {

    return;

  }

  document.getElementById(
    "printBookingId"
  ).innerText =
    booking.bookingId;

  document.getElementById(
    "printPatientName"
  ).innerText =
    booking.fullName;

  document.getElementById(
    "printEmployeeName"
  ).innerText =
    text[currentLang].employeeLabel +
    ": " +
    (
      currentUsername ||
      currentEmployee
    );

  window.print();

}


/* =========================================================
   FAST STATUS UPDATE
========================================================= */

async function updateStatus(
  bookingId,
  action
) {

  if (
    pendingBookings.has(
      bookingId
    )
  ) {

    return;

  }

  const booking =
    bookings.find(
      function(item) {

        return (
          item.bookingId ===
          bookingId
        );

      }
    );

  if (!booking) {

    return;

  }

  clearResult();

  const oldStatus =
    booking.status;

  const newStatus =
    action === "markReceived"
      ? "Received"
      : "Delivered";

  booking.status =
    newStatus;

  pendingBookings.add(
    bookingId
  );

  renderBookings();

  try {

    const data =
      await postApi(
        action,
        {
          bookingId:
            booking.bookingId,

          pickupDate:
            booking.pickupDate,

          pickupTime:
            booking.pickupTime,

          pharmacy:
            booking.pharmacy
        },
        true
      );

    if (
      !data ||
      !data.success
    ) {

      booking.status =
        oldStatus;

      pendingBookings.delete(
        bookingId
      );

      renderBookings();

      if (
        isSessionError(
          data
        )
      ) {

        handleSessionExpired();

        return;

      }

      showResult(
        "error",
        formatUpdateError(
          data
        )
      );

      return;

    }

    pendingBookings.delete(
      bookingId
    );

    renderBookings();

    showResult(
      "success",
      text[currentLang].updated
    );

  } catch(error) {

    booking.status =
      oldStatus;

    pendingBookings.delete(
      bookingId
    );

    renderBookings();

    showResult(
      "error",
      text[currentLang].updateFailed
    );

  }

}


/* =========================================================
   ERROR
========================================================= */

function formatUpdateError(
  data
) {

  const reason =
    data &&
    (
      data.code ||
      data.message
    )
      ? (
          data.code ||
          data.message
        )
      : "";

  if (!reason) {

    return text[currentLang].updateFailed;

  }

  return (
    text[currentLang].updateFailed +
    " (" +
    reason +
    ")"
  );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  ).replace(
    /[&<>"]/g,
    function(ch) {

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[ch];

    }
  );

}


function escapeJs(
  value
) {

  return String(
    value === null ||
    value === undefined
      ? ""
      : value
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /\r/g,
      ""
    )
    .replace(
      /\n/g,
      "\\n"
    );

}


/* =========================================================
   START
========================================================= */

async function init() {

  setLanguage(
    "ar"
  );

  await restoreSession();

}


document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>
