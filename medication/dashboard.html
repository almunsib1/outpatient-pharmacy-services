<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medication Pickup Service Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:16px;
  color:#168fb3
}

.container{
  max-width:1100px;
  margin:auto;
  background:#fff;
  padding:22px;
  border-radius:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.1)
}

.top-bar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:8px;
  direction:rtl
}

.logo{
  width:120px;
  height:120px;
  object-fit:contain
}

.official-header{
  width:fit-content;
  max-width:100%;
  text-align:start;
  margin-inline-start:0;
  margin-inline-end:auto;
  transform:translateY(14px)
}

.official-header h2,
.official-header h3{
  margin:2px 0;
  font-size:13px;
  line-height:1.4;
  color:#168fb3
}

[dir="rtl"] .official-header{
  padding-left:8px;
  border-left:4px solid #168fb3
}

[dir="ltr"] .official-header{
  padding-right:8px;
  border-right:4px solid #168fb3
}

hr{
  border:none;
  border-top:1px solid #e5e7eb;
  margin:14px 0
}

.page-title{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  margin:14px 0 10px;
  color:#168fb3
}

.subtitle{
  text-align:center;
  color:#168fb3;
  margin-bottom:18px;
  line-height:1.7
}

.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
  direction:ltr
}

.date-box{
  color:#168fb3;
  padding:6px 10px;
  font-size:13px;
  font-weight:bold;
  text-align:center
}

.language-btn{
  border:none;
  background:transparent;
  cursor:pointer;
  font-size:13px;
  font-weight:bold;
  color:#168fb3;
  padding:4px 0
}

.cards{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:8px;
  margin-bottom:16px
}

.card{
  background:#168fb3;
  color:#fff;
  padding:10px 8px;
  border-radius:8px;
  text-align:center;
  min-width:0
}

.card h2{
  margin:0;
  font-size:16px;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.card p{
  margin:5px 0 0;
  font-size:11px;
  line-height:1.35
}

.insight{
  background:#f9fafb;
  color:#168fb3;
  border:1px solid #e5e7eb
}

.table-wrap{
  max-width:760px;
  margin:0 auto;
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
  min-width:520px
}

th,
td{
  padding:8px 6px;
  border:1px solid #e5e7eb;
  text-align:center;
  color:#111827;
  font-size:12px
}

th{
  background:#168fb3;
  color:#fff
}

.loading{
  text-align:center;
  font-size:18px;
  padding:30px;
  color:#168fb3
}

.login-card{
  max-width:300px;
  margin:20px auto;
  padding:16px;
  background:#f9fafb;
  border:1px solid #e5e7eb;
  border-radius:10px
}

.login-card label{
  display:block;
  font-weight:bold;
  margin-bottom:5px;
  font-size:13px
}

.login-card input{
  width:100%;
  height:38px;
  padding:8px 10px;
  margin-bottom:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:14px;
  background:#fff
}

.login-btn{
  display:block;
  margin:auto;
  border:none;
  background:#168fb3;
  color:#fff;
  font-size:14px;
  font-weight:bold;
  padding:9px 18px;
  border-radius:8px;
  cursor:pointer
}

.login-btn:disabled{
  opacity:.6;
  cursor:not-allowed
}

.login-message{
  display:none;
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-size:13px
}

.login-message.error{
  display:block;
  background:#fef2f2;
  color:#991b1b
}

.error-box{
  display:none;
  margin:16px auto;
  max-width:600px;
  padding:12px;
  background:#fef2f2;
  color:#991b1b;
  border-radius:8px;
  text-align:center
}

@media (max-width:600px){

  body{
    padding:10px;
    background:#fff
  }

  .container{
    padding:14px;
    border-radius:0;
    box-shadow:none
  }

  .logo{
    width:84px;
    height:84px
  }

  .official-header{
    transform:translateY(10px)
  }

  .official-header h2,
  .official-header h3{
    font-size:12px
  }

  .page-title{
    font-size:20px
  }

  .date-box,
  .language-btn{
    font-size:12px;
    padding:6px 9px
  }

  .cards{
    grid-template-columns:repeat(2,minmax(0,1fr))
  }

  .card{
    padding:9px 6px
  }

  .card h2{
    font-size:15px
  }

  .card p{
    font-size:10px
  }

  table{
    min-width:440px
  }

  th,
  td{
    padding:6px 5px;
    font-size:11px
  }
}
</style>
</head>

<script>

let currentSessionToken =

const text = {

    login:

    loggingIn:
      "Signing in...",

    invalidLogin:
      "Incorrect username/PIN or no permission.",

    loading:

    failed:
      "Unable to load dashboard data.",

    sessionExpired:
      "Session expired. Please sign in again.",

    totalBookings:
      "Total Bookings Today",

    remainingToday:
      "Remaining Capacity",

    occupancyRate:
      "Occupancy Rate",

    dailyStatus:
      "Daily Status",

    busiestSlot:
      "Busiest Slot",

    leastBusySlot:

    timeSlot:

    remaining:

/* =========================================================
   LANGUAGE
========================================================= */

function setLanguage(
  lang
) {

  currentLang =
    lang;

  document.documentElement.lang =
    lang;

  document.documentElement.dir =
    lang === "ar"
      ? "rtl"
      : "ltr";


  document.getElementById(
    "officialLine1"
  ).innerText =
    text[lang].officialLine1;


  document.getElementById(
    "officialLine2"
  ).innerText =
    text[lang].officialLine2;


  document.getElementById(
    "officialLine3"
  ).innerText =
    text[lang].officialLine3;


  document.getElementById(
    "pageTitle"
  ).innerText =
    text[lang].pageTitle;


  document.getElementById(
    "pageSubtitle"
  ).innerText =
    text[lang].pageSubtitle;


  document.getElementById(
    "usernameLabel"
  ).innerText =
    text[lang].username;


  document.getElementById(
    "pinLabel"
  ).innerText =
    text[lang].pin;


  document.getElementById(
    "loginBtn"
  ).innerText =
    text[lang].login;


  document.getElementById(
    "totalBookingsLabel"

    text[lang].totalBookings;


  document.getElementById(

    "remainingHeader"

    text[lang].remaining;


  document.getElementById(
    "slotOccupancyHeader"
  ).innerText =
    text[lang].occupancy;


  document.getElementById(
    "languageToggle"
  ).innerText =
    "🌐 ع | E";


  if (
    dashboardData
  ) {
    renderDashboard();
  }
}


function toggleLanguage() {

  setLanguage(
    currentLang === "ar"
      ? "en"
      : "ar"
  );
}


/* =========================================================
   UI
========================================================= */

function showLoading() {

  document.getElementById(
    "loginView"
  ).style.display =
    "none";

  document.getElementById(
    "dashboard"
  ).style.display =
    "none";

  document.getElementById(
    "errorBox"
  ).style.display =
    "none";

  document.getElementById(
    "loading"
  ).style.display =
    "block";

  document.getElementById(
    "loading"
  ).innerText =
    text[currentLang].loading;
}


function hideLoading() {

  document.getElementById(
    "loading"
  ).style.display =
    "none";
}


function showLogin() {

  hideLoading();

  document.getElementById(
    "dashboard"
  ).style.display =
    "none";

  document.getElementById(
    "errorBox"
  ).style.display =
    "none";

  document.getElementById(
    "loginView"
  ).style.display =
    "block";
}


function showDashboard() {

  hideLoading();

  document.getElementById(
    "loginView"
  ).style.display =
    "none";

  document.getElementById(
    "errorBox"
  ).style.display =
    "none";

  document.getElementById(
    "dashboard"
  ).style.display =
    "block";
}


function showError(
  message
) {

  hideLoading();

  document.getElementById(
    "loginView"
  ).style.display =
    "none";

  document.getElementById(
    "dashboard"
  ).style.display =
    "none";

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display =
    "block";

  box.innerText =
    message;
}


function showLoginError(
  message
) {

  const box =
    document.getElementById(
      "loginMessage"
    );

  box.className =
    "login-message error";

  box.innerText =
    message;
}


function clearLoginError() {

  const box =
    document.getElementById(
      "loginMessage"
    );

  box.className =
    "login-message";

  box.innerText =
    "";
}


/* =========================================================
   STORAGE
========================================================= */

function saveSession(
  token,
  user
) {

  currentSessionToken =
    token;


  localStorage.setItem(
    SESSION_TOKEN_KEY,
    token
  );


  if (
    user
  ) {

    localStorage.setItem(
      SESSION_USERNAME_KEY,
      user.username || ""
    );

    localStorage.setItem(
      SESSION_NAME_KEY,
      user.name ||
      user.username ||
      ""
    );
  }
}


function clearSession() {

  currentSessionToken =
    "";

  localStorage.removeItem(
    SESSION_TOKEN_KEY
  );

  localStorage.removeItem(
    SESSION_USERNAME_KEY
  );

  localStorage.removeItem(
    SESSION_NAME_KEY
  );
}


/* =========================================================
   API
========================================================= */

async function postApi(
  action,
  payload = {},
  useSession = true
) {

  const requestData = {
    action:
      action,

    ...payload
  };


  if (
    useSession
  ) {

    currentSessionToken =
      localStorage.getItem(
        SESSION_TOKEN_KEY
      ) ||
      currentSessionToken ||
      "";


    if (
      currentSessionToken
    ) {
      requestData.sessionToken =
        currentSessionToken;
    }
  }


  const response =
    await fetch(
      API_URL,
      {
        method:
          "POST",

        headers:{
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(
            requestData
          )
      }
    );


  if (
    !response.ok
  ) {
    throw new Error(
      "HTTP_" +
      response.status
    );
  }


  return await response.json();
}


/* =========================================================
   SESSION CHECK
========================================================= */

function isInvalidSession(
  result
) {

  if (
    !result
  ) {
    return false;
  }

  return [
    "INVALID_SESSION",
    "MISSING_SESSION",
    "SESSION_REQUIRED",
    "NO_PERMISSION",
    "USER_INACTIVE",
    "UNAUTHORIZED"
  ].includes(
    result.code
  );
}


async function validateCurrentSession() {

  currentSessionToken =
    localStorage.getItem(
      SESSION_TOKEN_KEY
    ) || "";


  if (
    !currentSessionToken
  ) {
    return false;
  }


  try {

    const result =
      await postApi(
        "validateSession",
        {
          service:
            "med"
        },
        true
      );


    if (
      result &&
      result.success &&
      result.user
    ) {

      saveSession(
        currentSessionToken,
        result.user
      );

      return true;
    }


    if (
      isInvalidSession(
        result
      )
    ) {
      clearSession();
      return false;
    }


    /*
    إذا الرد غريب لا نمسح الجلسة.
    */
    return false;


  } catch(error) {

    /*
    خطأ الاتصال لا يمسح مفتاح الدخول.
    */
    throw error;
  }
}


/* =========================================================
   LOGIN
========================================================= */

async function loginEmployee() {

  clearLoginError();


  const username =
    document.getElementById(
      "username"
    ).value.trim();


  const pin =
    document.getElementById(
      "pin"
    ).value.trim();


  if (
    !username ||
    !pin
  ) {

    showLoginError(
      text[currentLang].invalidLogin
    );

    return;
  }


  const button =
    document.getElementById(
      "loginBtn"
    );


  button.disabled =
    true;

  button.innerText =
    text[currentLang].loggingIn;


  try {

    const result =
      await postApi(
        "employeeLogin",
        {
          username:
            username,

          password:
            pin
        },
        false
      );


    if (
      !result ||
      !result.success ||
      !result.sessionToken ||
      !result.employee
    ) {

      showLoginError(
        text[currentLang].invalidLogin
      );

      return;
    }


    saveSession(
      result.sessionToken,
      {
        username:
          result.employee.username,

        name:
          result.employee.name
      }
    );


    document.getElementById(
      "pin"
    ).value =
      "";


    await loadDashboard();


  } catch(error) {

    showLoginError(
      text[currentLang].failed
    );


  } finally {

    button.disabled =
      false;

    button.innerText =
      text[currentLang].login;
  }
}


/* =========================================================
   LOAD DASHBOARD
========================================================= */

async function loadDashboard() {

  showLoading();


  try {

    const result =
      await postApi(
        "dashboard",
        {},
        true
      );


    if (
      result &&
      result.success &&
      result.dashboard
    ) {

      dashboardData =
        result.dashboard;

      showDashboard();

      renderDashboard();

      return;
    }


    if (
      isInvalidSession(
        result
      )
    ) {

      clearSession();

      showLogin();

      showLoginError(
        text[currentLang].sessionExpired
      );

      return;
    }


    showError(
      text[currentLang].failed
    );


  } catch(error) {

    /*
    لا نحذف الجلسة بسبب مشكلة اتصال.
    */
    showError(
      text[currentLang].failed
    );
  }
}


/* =========================================================
   STATUS LABEL
========================================================= */

function statusLabel(
  status
) {

  if (
    status === "HIGH"
  ) {
    return text[currentLang].high;
  }

  if (
    status === "MEDIUM"
  ) {
    return text[currentLang].medium;
  }

  return text[currentLang].low;
}


/* =========================================================
   DASHBOARD RENDER
========================================================= */

function renderDashboard() {

  const d =
    dashboardData;


  if (
    !d
  ) {
    return;
  }


  const busiestSlot =
    d.busiestSlot || {
      time:
        "-",

      booked:
        0
    };


  const leastBusySlot =
    d.leastBusySlot || {
      time:
        "-",

      booked:
        0
    };


  document.getElementById(
    "dateBox"
  ).innerText =
    getDisplayDayName(
      d
    ) +
    " - " +
    String(
      d.date || ""
    );


  document.getElementById(
    "totalBookings"
  ).innerText =
    Number(
      d.totalBookings || 0
    );


  document.getElementById(
    "remainingToday"

    Number(
      d.remainingToday || 0
    );


  document.getElementById(
    "occupancyRate"

    Number(
      d.occupancyRate || 0
    ) +
    "%";


  document.getElementById(
    "statusText"
  ).innerText =
    statusLabel(
      d.status
    );


  document.getElementById(
    "busiestSlot"
  ).innerText =
    String(
      busiestSlot.time ||
      "-"
    ) +
    " (" +
    Number(
      busiestSlot.booked || 0
    ) +
    ")";


  document.getElementById(
    "leastBusySlot"
  ).innerText =
    String(
      leastBusySlot.time ||
      "-"
    ) +
    " (" +
    Number(
      leastBusySlot.booked || 0
    ) +
    ")";


  const slots =
    Array.isArray(
      d.slots
    )
      ? d.slots
      : [];


  const tbody =
    document.getElementById(
      "slotsTable"
    );


  tbody.innerHTML =
    "";


  slots.forEach(
    function(slot) {

      const tr =
        document.createElement(
          "tr"
        );


      const tdTime =
        document.createElement(
          "td"
        );

      tdTime.textContent =
        slot.time || "";


      const tdBooked =
        document.createElement(
          "td"
        );

      tdBooked.textContent =
        Number(
          slot.booked || 0
        );


      const tdRemaining =
        document.createElement(
          "td"
        );

      tdRemaining.textContent =
        Number(
          slot.remaining || 0
        );


      const tdOccupancy =
        document.createElement(
          "td"
        );

      tdOccupancy.textContent =
        Number(
          slot.occupancy || 0
        ) +
        "%";


      tr.appendChild(
        tdTime
      );

      tr.appendChild(
        tdBooked
      );

      tr.appendChild(
        tdRemaining
      );

      tr.appendChild(
        tdOccupancy
      );


      tbody.appendChild(
        tr
      );
    }
  );
}


/* =========================================================
   DAY
========================================================= */

function getDisplayDayName(
  data
) {

  const apiDayName =
    currentLang === "ar"
      ? data.dayNameAr
      : data.dayNameEn;


  if (
    apiDayName
  ) {
    return apiDayName;
  }


  const dayNames =
    currentLang === "ar"
      ? [
          "الأحد",
          "الإثنين",
          "الثلاثاء",
          "الأربعاء",
          "الخميس",
          "الجمعة",
          "السبت"
        ]
      : [
          "Sunday",
          "Monday",
          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",
          "Saturday"
        ];


  const parsedDate =
    new Date(
      String(
        data.date || ""
      ) +
      "T12:00:00"
    );


  return dayNames[
    parsedDate.getDay()
  ] || "";
}


/* =========================================================
   ENTER KEY
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      document.getElementById(
        "loginView"
      ).style.display !==
        "none"
    ) {

      loginEmployee();
    }
  }
);


/* =========================================================
   START
========================================================= */

async function init() {

  setLanguage(
    "ar"
  );

  showLoading();


  try {

    const valid =
      await validateCurrentSession();


    if (
      valid
    ) {

      await loadDashboard();

      return;
    }


    showLogin();


  } catch(error) {

    /*
    لو مفتاح الدخول موجود ولكن حصل خطأ اتصال،
    لا نمسحه.
    */
    if (
      localStorage.getItem(
        SESSION_TOKEN_KEY
      )
    ) {

      showError(
        text[currentLang].failed
      );

    } else {

      showLogin();
    }
  }
}


document.addEventListener(
  "DOMContentLoaded",
  init
);
